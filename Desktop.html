<!doctype html>
<html lang="zh-Hant">
<head>
  <script src="device-route.js"></script>
  <meta charset="utf-8" />
  <link rel="icon" href="bear-logo_(Security%20C).ico" type="image/x-icon">
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CQE | AI Class Check In System</title>
  <meta name="description" content="CQE AI Class Check In System: REST-only, Supabase backend, file:// friendly."/>
  <link rel="stylesheet" href="styles/tokens.css">

  <style>
    *{box-sizing:border-box}
    html,body{height:100%}
    body{margin:0;background:var(--bg);color:var(--text);font:15px/1.6 var(--font);-webkit-font-smoothing:antialiased}
    a{color:var(--accent);text-decoration:none}
    .wrap{max-width:1280px;margin:0 auto;padding:20px 22px 40px}

    /* ── Header ─────────────────────────────────────────────── */
    header{display:flex;align-items:center;gap:10px;margin:0 0 18px;justify-content:space-between}
    header .logo{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;overflow:hidden;flex-shrink:0}
    header h1{font-size:18px;margin:0;color:var(--text);font-weight:700}

    /* ── 頂層分頁（學員報到 / 管理後台）：外框式 pill ─────────── */
    .tabs{display:flex;gap:6px;flex-wrap:wrap}
    .tab-btn{
      appearance:none;background:var(--glass);border:1px solid var(--line);color:var(--muted);
      padding:8px 16px;line-height:1.3;border-radius:999px;cursor:pointer;font-weight:600;
      font-family:var(--font);font-size:13px;
      transition:border-color .2s var(--ease), color .2s var(--ease), background .2s var(--ease);
    }
    .tab-btn:hover{border-color:var(--line-hi);color:var(--text)}
    .tab-btn.active{background:rgba(91,184,255,.1);border-color:var(--accent);color:var(--accent)}
    .tab-btn:focus-visible{outline:none;border-color:rgba(91,184,255,.5);box-shadow:0 0 0 4px rgba(91,184,255,.09)}

    .grid{display:grid;gap:16px}
    .g2{grid-template-columns:1fr 1fr}
    @media(max-width:900px){.g2{grid-template-columns:1fr}}

    /* ── 雙層 bezel 卡片：單一 .card 元素以 ::before 模擬內核, 避免大量 DOM 改動 ── */
    .card{
      position:relative;background:var(--glass);border:1px solid var(--line);border-radius:var(--r-out);
      padding:22px;isolation:isolate;
      opacity:0;transform:translateY(16px);filter:blur(6px);
      transition:opacity .7s var(--ease), transform .7s var(--ease), filter .7s var(--ease);
    }
    .card.is-visible{opacity:1;transform:translateY(0);filter:blur(0)}
    .card::before{
      content:'';position:absolute;inset:6px;background:var(--core);border-radius:var(--r-in);
      box-shadow:var(--inset-hi);z-index:-1;
    }
    .card h3{margin:0 0 10px;font-size:16px;color:var(--text)}

    /* ── 圖表卡片: KPI 標頭 + 自訂圖例 ── */
    .chart-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:0;flex-wrap:wrap}
    .chart-eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.14em;color:var(--muted);margin-bottom:4px}
    .chart-title{margin:0;font-size:14px;font-weight:500;color:var(--muted);display:flex;align-items:baseline;gap:6px}
    .chart-kpi{font-size:30px;font-weight:800;color:var(--accent);letter-spacing:-.01em}
    .chart-legend{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px;justify-content:center}
    .chart-legend-chip{
      display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:999px;
      border:1px solid;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
      cursor:pointer;user-select:none;transition:opacity .2s var(--ease);
    }
    .chart-legend-chip.is-hidden{opacity:.35}
    .chart-legend-chip .dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
    .chart-head-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
    .chart-mode{display:flex;gap:4px}
    .chart-mode-btn{
      background:var(--glass);border:1px solid var(--line);color:var(--muted);
      padding:6px 14px;border-radius:999px;cursor:pointer;font-family:var(--font);font-size:12px;font-weight:600;
      transition:border-color .2s var(--ease), color .2s var(--ease), background .2s var(--ease);
    }
    .chart-mode-btn:hover{border-color:var(--line-hi);color:var(--text)}
    .chart-mode-btn.active{background:rgba(91,184,255,.1);border-color:var(--accent);color:var(--accent)}
    .chart-mode-btn:focus-visible{outline:none;border-color:rgba(91,184,255,.5);box-shadow:0 0 0 4px rgba(91,184,255,.09)}

    /* ── 深色提示視窗 (取代原生 alert) ── */
    .cqe-modal-overlay{
      position:fixed;inset:0;background:rgba(5,5,5,.6);backdrop-filter:blur(8px);
      display:flex;align-items:center;justify-content:center;z-index:200;
      opacity:0;pointer-events:none;transition:opacity .25s var(--ease);padding:20px;
    }
    .cqe-modal-overlay.show{opacity:1;pointer-events:auto}
    .cqe-modal{
      position:relative;background:var(--glass);border:1px solid var(--line);border-radius:var(--r-out);
      padding:22px;max-width:380px;width:100%;isolation:isolate;
      transform:translateY(12px) scale(.98);transition:transform .25s var(--ease);
    }
    .cqe-modal-overlay.show .cqe-modal{transform:translateY(0) scale(1)}
    .cqe-modal::before{content:'';position:absolute;inset:6px;background:var(--core);border-radius:var(--r-in);box-shadow:var(--inset-hi);z-index:-1}
    .cqe-modal-title{margin:0 0 12px;font-size:16px;color:var(--text)}
    .cqe-modal-msg{color:var(--text);font-size:14px;line-height:1.6;white-space:pre-wrap}
    .cqe-modal-form{max-height:60vh;overflow-y:auto;padding-right:4px}
    .cqe-modal-actions{margin-top:18px;display:flex;justify-content:flex-end;gap:10px}
    .cqe-modal-ok,.cqe-modal-cancel,.cqe-modal-danger{
      appearance:none;padding:8px 20px;border-radius:999px;cursor:pointer;font-weight:600;
      font-family:var(--font);font-size:13px;transition:background .2s var(--ease), border-color .2s var(--ease), color .2s var(--ease);
    }
    .cqe-modal-ok{background:var(--glass);border:1px solid var(--accent);color:var(--accent)}
    .cqe-modal-ok:hover{background:rgba(91,184,255,.1)}
    .cqe-modal-ok:focus-visible{outline:none;border-color:rgba(91,184,255,.5);box-shadow:0 0 0 4px rgba(91,184,255,.09)}
    .cqe-modal-cancel{background:var(--glass);border:1px solid var(--line);color:var(--muted)}
    .cqe-modal-cancel:hover{border-color:var(--line-hi);color:var(--text)}
    .cqe-modal-cancel:focus-visible{outline:none;border-color:var(--line-hi);box-shadow:0 0 0 4px rgba(255,255,255,.06)}
    .cqe-modal-danger{background:rgba(248,113,113,.09);border:1px solid var(--danger);color:var(--danger)}
    .cqe-modal-danger:hover{background:rgba(248,113,113,.16)}
    .cqe-modal-danger:focus-visible{outline:none;border-color:var(--danger);box-shadow:0 0 0 4px rgba(248,113,113,.09)}
    label{display:block;font-size:13px;color:var(--muted);margin:10px 0 6px}
    input,select,textarea{
      width:100%;padding:10px 12px;border-radius:12px;border:1px solid var(--line);
      background:var(--core-2);color:var(--text);font-family:var(--font);font-size:14px;
      transition:border-color .2s var(--ease), box-shadow .2s var(--ease);
    }
    input::placeholder,textarea::placeholder{color:var(--dim)}
    input:focus-visible,select:focus-visible,textarea:focus-visible{
      outline:none;border-color:rgba(91,184,255,.5);box-shadow:0 0 0 4px rgba(91,184,255,.09);
    }

    /* ── 按鈕：一律外框式, 禁實心填色 ─────────────────────────── */
    button{
      appearance:none;border:1px solid var(--line-hi);background:var(--glass);color:var(--accent);
      border-radius:999px;padding:8px 16px;line-height:1.3;cursor:pointer;font-weight:600;
      font-family:var(--font);font-size:13px;
      transition:border-color .2s var(--ease), background .2s var(--ease), transform .15s var(--ease);
    }
    button:hover{background:var(--glass-hi);border-color:var(--accent)}
    button:active{transform:scale(.97)}
    button:focus-visible{outline:none;border-color:rgba(91,184,255,.5);box-shadow:0 0 0 4px rgba(91,184,255,.09)}
    button:disabled{opacity:.4;cursor:not-allowed}
    button.ghost{color:var(--muted);border-color:var(--line)}
    button.ghost:hover{color:var(--text);border-color:var(--line-hi)}

    .row{display:flex;gap:8px;flex-wrap:wrap}
    .chip{
      display:inline-flex;align-items:center;gap:6px;background:var(--glass);border:1px solid var(--line);
      color:var(--muted);padding:6px 12px;border-radius:999px;font-size:12px;
    }
    .muted{color:var(--muted)}
    .ok{color:var(--ok)} .warn{color:var(--warn)} .danger{color:var(--danger)}
    .hide{display:none}
    .note{font-size:12px;color:var(--muted)}
/* 👇 新增這三條，放在 .note 後面，提升「同時帶 note 與狀態」時的優先度 */
.note.warn   { color: var(--warn); }
.note.ok     { color: var(--ok); }
.note.danger { color: var(--danger); }
/* stat-bump 動畫已移至 styles/tokens.css */
#todayInfo.bump {
  animation: stat-bump .45s var(--ease);
}

    .list{display:grid;gap:8px}
    .list .item{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;background:var(--core-2);border:1px solid var(--line);border-radius:12px}

    /* CSV 區塊排版修正 */
    #cardCsv input[type="file"]{display:block;width:100%;margin:8px 0 10px;padding:8px;border-radius:12px}
    #cardCsv .row{display:flex;flex-wrap:wrap;gap:8px}
    #cardCsv .row button{flex:1 1 180px;min-width:160px;margin-top:4px}
    #csvMsg{margin-top:8px;display:block}

    /* 學員名片 */
    #studentCards { display:grid; gap:10px; grid-template-columns: 1fr; }
#studentCards .card-item{
  background:var(--core-2);
  border:1px solid var(--line);
  border-radius:14px;
  padding:10px 12px;
  display:flex;
  flex-direction:column;
  gap:6px;
  cursor:pointer;
  transition:transform .15s var(--ease), border-color .15s var(--ease), box-shadow .15s var(--ease), background-color .15s var(--ease);
}
#studentCards .card-item:hover{
  transform:translateY(-2px);
  border-color:var(--line-hi);
  background:var(--glass-hi);
  box-shadow:0 8px 16px rgba(0,0,0,.35);
}

    #studentCards .row-top{display:flex;align-items:center;gap:8px}
    #studentCards .avatar{
      width:28px;height:28px;border-radius:50%;
      background:var(--glass-hi);display:grid;place-items:center;
      font-size:12px;font-weight:700;color:var(--text);border:1px solid var(--line);
    }
    #studentCards .meta{font-size:12px;color:var(--muted)}
    #studentCards .card-item.checked{border-color:rgba(52,211,153,.4)!important;background:rgba(52,211,153,.06)}
    .chip-ok{font-size:11px;background:rgba(52,211,153,.1);color:var(--ok);border:1px solid rgba(52,211,153,.4);border-radius:999px;padding:3px 10px}
    /* 僅隱藏 ID(工號) 與 Team，不隱藏頭像 */
    #studentCards .row-top .meta { display: none !important; }
    #studentCards .avatar { display: grid !important; }
    #studentCards .row-top > div:not(.avatar) { margin-left: 0; }

    /* 深色原生控件（color-scheme 已於 styles/tokens.css 設為 dark, 圖示改用中性色) */
    input[type="date"],input[type="time"],select{background:var(--core-2);color:var(--text);border:1px solid var(--line)}
    input[type="date"]::-webkit-calendar-picker-indicator,
    input[type="time"]::-webkit-calendar-picker-indicator{opacity:0}
    input[type="time"]::-webkit-clear-button,
    input[type="time"]::-webkit-inner-spin-button{opacity:0}
    .picker-wrap{position:relative}
    .picker-wrap>input[type="date"],.picker-wrap>input[type="time"],.picker-wrap>input.cqe-dt-input{padding-right:42px}
    .picker-btn{position:absolute;right:10px;top:50%;transform:translateY(-50%);width:24px;height:24px;border:none;background:transparent;cursor:pointer;padding:0;opacity:.9}
    .picker-btn:focus-visible{outline:none;border-radius:8px;box-shadow:0 0 0 3px rgba(91,184,255,.25)}
    .picker-btn.calendar{
      background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='24' height='24' viewBox='0 0 24 24' fill='none' stroke='%23A2AAC0' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><rect x='3' y='4' width='18' height='18' rx='2' ry='2'/><line x1='16' y1='2' x2='16' y2='6'/><line x1='8' y1='2' x2='8' y2='6'/><line x1='3' y1='10' x2='21' y2='10'/></svg>");
      background-repeat:no-repeat;background-size:22px 22px;background-position:center;
    }
    .picker-btn.clock{
      background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='24' height='24' viewBox='0 0 24 24' fill='none' stroke='%23A2AAC0' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><circle cx='12' cy='12' r='10'/><polyline points='12 6 12 12 16 14'/></svg>");
      background-repeat:no-repeat;background-size:22px 22px;background-position:center;
    }

    /* Backfill table */
    #backfillTable{width:100%;border-collapse:separate;border-spacing:0 6px}
    #backfillTable th,#backfillTable td{padding:8px 10px}
    #backfillTable thead th{font-size:12px;color:var(--muted);text-align:left}
    #backfillTable tbody tr{background:var(--core-2);border:1px solid var(--line)}
    #backfillTable tbody tr td{border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
    #backfillTable tbody tr td:first-child{border-left:1px solid var(--line);border-top-left-radius:10px;border-bottom-left-radius:10px}
    #backfillTable tbody tr td:last-child{border-right:1px solid var(--line);border-top-right-radius:10px;border-bottom-right-radius:10px}
    #backfillTable td:last-child, #backfillTable th:last-child { text-align: center; }

    /* ── Admin 兩欄版面：左側垂直子分頁 nav（bezel 卡片）+ 右側內容 ── */
    .admin-layout{display:block}
    .subtabs{display:flex;flex-direction:row;flex-wrap:wrap;gap:6px}
    @media(max-width:768px){
      .subtabs{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:4px}
    }
    .subtab-btn{
      background:var(--glass);border:1px solid var(--line);color:var(--muted);
      padding:8px 16px;border-radius:999px;cursor:pointer;font-family:var(--font);font-size:13px;font-weight:600;
      white-space:nowrap;flex-shrink:0;line-height:1.3;
      transition:border-color .2s var(--ease), color .2s var(--ease), background .2s var(--ease);
    }
    .subtab-btn:hover{border-color:var(--line-hi);color:var(--text)}
    .subtab-btn.active{background:rgba(91,184,255,.1);border-color:var(--accent);color:var(--accent)}
    .subtab-btn:focus-visible{outline:none;border-color:rgba(91,184,255,.5);box-shadow:0 0 0 4px rgba(91,184,255,.09)}
    /* 分頁列容器不套卡片框：pill 各自有外框，容器再加框會變成框中框 */
    .admin-sidenav{background:none;border:none;padding:4px 0;margin-bottom:12px}
    .admin-sidenav::before{content:none}
    .admin-content{min-width:0}
    .admin-pane .card + .card{margin-top:16px}

/* 圓形 icon 按鈕樣式（外框式）*/
.icon-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 34px;
  height: 34px;
  border-radius: 50%;
  background: var(--glass);
  border: 1px solid var(--line);
  cursor: pointer;
  color: var(--text);
  transition: border-color .2s var(--ease), background .2s var(--ease), color .2s var(--ease);
}

.icon-btn:hover {
  border-color: var(--accent);
  color: var(--accent);
  background: var(--glass-hi);
}
.icon-btn:focus-visible{outline:none;border-color:rgba(91,184,255,.5);box-shadow:0 0 0 4px rgba(91,184,255,.09)}

.icon-btn svg {
  width: 14px;
  height: 14px;
  stroke-width: 2;
  flex-shrink: 0;    /* 避免被壓縮 */
  pointer-events: none;
}
/* spin-once 動畫已移至 styles/tokens.css */
.icon-btn.spin svg {
  animation: spin-once 0.6s var(--ease);
}
/* 報到區塊裡，兩個 row 元素連在一起時，自動在上方留白 */
#tab-checkin .row + .row {
  margin-top: 8px;
}
/* 自助報到 Add/清除 按鈕列 */
#btnCheckin,
#btnClearEmp {
  margin-top: 8px;
}

/* 自助建立學員 建立並報到/取消 按鈕列 */
#btnCreateStudent,
#btnCancelCreate {
  margin-top: 8px;
}
/* 學員名單（後台表格）懸停效果 */
#stuTable tbody tr{
  transition: background-color .12s var(--ease), box-shadow .12s var(--ease), transform .08s var(--ease), border-color .12s var(--ease);
}
#stuTable tbody tr:hover{
  background:var(--glass-hi) !important;
  /* 上下左右的邊線在你的程式裡是各個 td 各自畫的，這裡一起提亮 */
  border-color:var(--line-hi);
  transform:translateY(-1px);
  box-shadow:0 6px 12px rgba(0,0,0,.28);
}
#stuTable tbody tr:hover td{
  border-top-color:var(--line-hi) !important;
  border-bottom-color:var(--line-hi) !important;
}
#stuTable tbody tr:hover td:first-child{
  border-left-color:var(--line-hi) !important;
}
#stuTable tbody tr:hover td:last-child{
  border-right-color:var(--line-hi) !important;
}

/* 可排序表頭的懸停提示（你已把 cursor 設 pointer，這裡再加顏色變化） */
#stuTable thead th[data-sort]{
  transition: color .12s var(--ease), text-shadow .12s var(--ease);
}
#stuTable thead th[data-sort]:hover{
  color:var(--text);
  text-shadow:0 0 6px var(--accent-glow);
}
.error  { color: var(--danger); }
.success{ color: var(--ok); }

/* Function 篩選按鈕列（外框式, 禁實心填色）*/
#functionBar { display:none; flex-wrap:wrap; gap:6px; margin:10px 0; }
.fn-btn {
  background:var(--glass); border:1px solid var(--line); color:var(--muted);
  border-radius:999px; padding:6px 14px; font-size:13px; cursor:pointer; font-family:var(--font);
  transition: border-color .15s var(--ease), color .15s var(--ease), background .15s var(--ease);
}
.fn-btn:hover { border-color: var(--accent); color: var(--accent); }
.fn-btn.active { border-color: var(--accent); background: rgba(91,184,255,.1); color: var(--accent); }

/* ── 深色日期/時間選擇器 (取代原生 type=date/time 彈窗, 視覺沿用 index.html #monthPicker/.mp- 語言) ── */
input.cqe-dt-input{background:var(--core-2);color:var(--text);border:1px solid var(--line);cursor:pointer}
.cqe-dt-panel,.cqe-tm-panel{
  position:fixed;z-index:300;max-width:calc(100vw - 16px);
  background:var(--core);border:1px solid var(--line-hi);border-radius:16px;padding:12px;
  box-shadow:0 18px 50px rgba(0,0,0,.55);font-family:var(--font);
}
.cqe-dt-panel{width:264px}
.cqe-dt-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;gap:4px}
.cqe-dt-head button{
  appearance:none;background:var(--glass);border:1px solid var(--line);color:var(--text);border-radius:999px;
  cursor:pointer;font-family:var(--font);font-size:13px;padding:4px 12px;
  transition:border-color .2s var(--ease), color .2s var(--ease);
}
.cqe-dt-head button:hover{border-color:var(--accent);color:var(--accent)}
.cqe-dt-weekdays{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:4px}
.cqe-dt-weekdays div{text-align:center;font-size:11px;color:var(--muted);padding:2px 0}
.cqe-dt-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cqe-dt-grid.months,.cqe-dt-grid.years{grid-template-columns:repeat(4,1fr)}
.cqe-dt-grid button{
  appearance:none;background:transparent;border:1px solid transparent;color:var(--muted);border-radius:10px;
  cursor:pointer;font-family:var(--font);font-size:13px;padding:6px 0;
  transition:border-color .2s var(--ease), color .2s var(--ease), background .2s var(--ease);
}
.cqe-dt-grid button:hover{border-color:var(--line-hi);color:var(--text)}
.cqe-dt-grid button.other{opacity:.35}
.cqe-dt-grid button.today{border-color:var(--accent);color:var(--accent)}
.cqe-dt-grid button.selected{background:rgba(91,184,255,.15);border-color:var(--accent);color:var(--accent)}
.cqe-dt-foot{display:flex;justify-content:space-between;margin-top:10px}
.cqe-dt-foot button{

<script>
  // ===== Phase 2 共用模組解構 =====
  const { SUPABASE_URL, SUPABASE_ANON_KEY, CHART_PALETTE } = window.CQE.config;

  // ===== 深色風提示視窗 (取代原生 alert，用法不變: showAlert(msg)) =====
  function showAlert(message){
    return new Promise(resolve=>{
      const overlay = document.createElement('div');
      overlay.className = 'cqe-modal-overlay';
      overlay.innerHTML = `
        <div class="cqe-modal" role="alertdialog" aria-modal="true">
          <div class="cqe-modal-msg"></div>
          <div class="cqe-modal-actions"><button class="cqe-modal-ok">確定</button></div>
        </div>`;
      overlay.querySelector('.cqe-modal-msg').textContent = message;
      document.body.appendChild(overlay);
      requestAnimationFrame(()=> overlay.classList.add('show'));
      function close(){
        overlay.classList.remove('show');
        document.removeEventListener('keydown', onKey);
        setTimeout(()=> overlay.remove(), 200);
        resolve();
      }
      function onKey(e){ if (e.key === 'Escape') close(); }
      document.addEventListener('keydown', onKey);
      overlay.addEventListener('click', e=>{ if (e.target === overlay) close(); });
      overlay.querySelector('.cqe-modal-ok').addEventListener('click', close);
      overlay.querySelector('.cqe-modal-ok').focus();
    });
  }

  // ===== 深色風確認視窗 (取代原生 confirm，用法: await showConfirm(msg) → boolean) =====
  function showConfirm(message){
    return new Promise(resolve=>{
      const overlay = document.createElement('div');
      overlay.className = 'cqe-modal-overlay';
      overlay.innerHTML = `
        <div class="cqe-modal" role="alertdialog" aria-modal="true">
          <div class="cqe-modal-msg"></div>
          <div class="cqe-modal-actions">
            <button class="cqe-modal-cancel" type="button">取消</button>
            <button class="cqe-modal-danger" type="button">確定</button>
          </div>
        </div>`;
      overlay.querySelector('.cqe-modal-msg').textContent = message;
      document.body.appendChild(overlay);
      requestAnimationFrame(()=> overlay.classList.add('show'));
      let settled = false;
      function close(result){
        if (settled) return; settled = true;
        overlay.classList.remove('show');
        document.removeEventListener('keydown', onKey);
        setTimeout(()=> overlay.remove(), 200);
        resolve(result);
      }
      function onKey(e){
        if (e.key === 'Escape') close(false);
        if (e.key === 'Enter') close(true);
      }
      document.addEventListener('keydown', onKey);
      overlay.addEventListener('click', e=>{ if (e.target === overlay) close(false); });
      overlay.querySelector('.cqe-modal-cancel').addEventListener('click', ()=> close(false));
      overlay.querySelector('.cqe-modal-danger').addEventListener('click', ()=> close(true));
      overlay.querySelector('.cqe-modal-danger').focus();
    });
  }

  // ===== 報到前身分確認 (防誤點他人名字, 與 Mobile.html 同款): 顯示 Function/部門碼/ID/名字 =====
  function confirmCheckinIdentity(s){
    return new Promise(resolve=>{
      const overlay = document.createElement('div');
      overlay.className = 'cqe-modal-overlay';
      const items = [
        ['Function', s.function || '—'],
        ['部門碼', s.team || '—'],
        ['ID', s.employee_no || '—'],
        ['名字', s.name || '—']
      ];
      overlay.innerHTML = `
        <div class="cqe-modal" role="alertdialog" aria-modal="true">
          <div class="cqe-modal-title" style="font-weight:700;color:var(--text);margin-bottom:4px">請確認是你本人</div>
          <div style="font-size:12px;color:var(--muted);margin-bottom:14px">確認以下資料無誤後再完成報到</div>
          <div style="display:grid;grid-template-columns:auto 1fr;gap:8px 14px;font-size:14px">
            ${items.map(([k,v])=>
              '<div style="color:var(--muted)">'+escapeHtml(k)+'</div>' +
              '<div style="color:var(--text);font-weight:700">'+escapeHtml(v)+'</div>').join('')}
          </div>
          <div class="cqe-modal-actions">
            <button class="cqe-modal-cancel" type="button">取消</button>
            <button class="cqe-modal-ok" type="button">確認報到</button>
          </div>
        </div>`;
      document.body.appendChild(overlay);
      requestAnimationFrame(()=> overlay.classList.add('show'));
      let settled = false;
      function close(result){
        if (settled) return; settled = true;
        overlay.classList.remove('show');
        document.removeEventListener('keydown', onKey);
        setTimeout(()=> overlay.remove(), 200);
        resolve(result);
      }
      function onKey(e){ if (e.key === 'Escape') close(false); }
      document.addEventListener('keydown', onKey);
      overlay.addEventListener('click', e=>{ if (e.target === overlay) close(false); });
      overlay.querySelector('.cqe-modal-cancel').addEventListener('click', ()=> close(false));
      overlay.querySelector('.cqe-modal-ok').addEventListener('click', ()=> close(true));
      overlay.querySelector('.cqe-modal-ok').focus();
    });
  }

  // ===== 深色風表單視窗 (取代連續 prompt，用法: await showFormModal({title, fields}) → object|null) =====
  // fields: [{key, label, value, placeholder, type}] type 預設 'text'，支援 'textarea'
  function showFormModal({ title, fields }){
    return new Promise(resolve=>{
      const overlay = document.createElement('div');
      overlay.className = 'cqe-modal-overlay';
      const fieldsHtml = fields.map(f=>{
        const type = f.type || 'text';
        const val = escapeHtml(f.value ?? '');
        const ph = f.placeholder ? ` placeholder="${escapeHtml(f.placeholder)}"` : '';
        const labelHtml = `<label style="white-space:pre-wrap">${escapeHtml(f.label)}</label>`;
        if (type === 'textarea'){
          return `${labelHtml}<textarea data-key="${escapeHtml(f.key)}" rows="3"${ph}>${val}</textarea>`;
        }
        return `${labelHtml}<input data-key="${escapeHtml(f.key)}" type="${type}" value="${val}"${ph}>`;
      }).join('');
      overlay.innerHTML = `
        <div class="cqe-modal" role="dialog" aria-modal="true">
          ${title ? `<h3 class="cqe-modal-title">${escapeHtml(title)}</h3>` : ''}
          <div class="cqe-modal-form">${fieldsHtml}</div>
          <div class="cqe-modal-actions">
            <button class="cqe-modal-cancel" type="button">取消</button>
            <button class="cqe-modal-ok" type="button">確定</button>
          </div>
        </div>`;
      document.body.appendChild(overlay);
      requestAnimationFrame(()=> overlay.classList.add('show'));
      const inputs = Array.from(overlay.querySelectorAll('[data-key]'));
      inputs.forEach(el=>{
        if (el.type === 'date') attachDatePicker(el);
        else if (el.type === 'time') attachTimePicker(el);
      });
      let settled = false;
      function close(result){
        if (settled) return; settled = true;
        overlay.classList.remove('show');

      document.addEventListener('keydown', onKey);
      overlay.addEventListener('click', e=>{ if (e.target === overlay) close(null); });

  // ===== 深色日期/時間選擇器 (取代原生 type=date/time 彈窗; 視覺沿用月曆年月選擇器語言) =====

  (function(){

      let top = r.bottom + 6;
      if (top + ph > window.innerHeight - 8) top = Math.max(8, r.top - ph - 6);
      panel.style.left = left + 'px';
      panel.style.top = top + 'px';

        let cells = '';

        }

// 追蹤上一次的統計，用來判斷是否播放動畫
let __prevStats = { checked: null, unchecked: null, rate: null };

function updateTodayStats(){
  const isToday = selCourseToday?.selectedOptions?.[0]?.dataset?.date === todayStr();
  if (!isToday) return;

  // 依目前選中的 Function Tab 過濾學員，再計算統計
  const filteredStudents = __selectedFunction !== null
    ? __studentsCache.filter(s => (s.function||'').trim() === __selectedFunction)
    : __studentsCache;
  const total   = filteredStudents.length || 0;
  const checked = filteredStudents.filter(s => __checkedSet.has(String(s.id))).length;
  const unchecked = Math.max(0, total - checked);
  const rate      = total > 0 ? Math.round((checked / total) * 100) : 0;

  // 更新文字
  todayInfo.textContent = `已報到: ${checked} 人, 未報到: ${unchecked} 人, 參與率: ${rate}%`;
  todayInfo.className = 'note'; // 保持基礎樣式（今天才是白字）

  // 若統計有變化，觸發動畫（移除→強制回流→加回 class）
  const changed = (
    __prevStats.checked   !== checked ||
    __prevStats.unchecked !== unchecked ||
    __prevStats.rate      !== rate
  );
  if (changed) {
    todayInfo.classList.remove('bump');
    void todayInfo.offsetWidth;      // 強制回流以重置動畫
    todayInfo.classList.add('bump'); // 播放動畫
  }

  // 記錄這次數值
  __prevStats = { checked, unchecked, rate };

  refreshCheckinMsg(); // 你原本的行為：同步自助報到狀態
}

/* ===== Realtime：attendance 變更即時更新（唯一版本）===== */
let __rtChannel = null;
let __rtDebounce = null;

// 小防抖：併流兩側同時報到的瞬時多事件，120ms 後只刷新一次
function scheduleRealtimeRefresh(){
  clearTimeout(__rtDebounce);
  __rtDebounce = setTimeout(()=>{
    loadStudentsAndAttendance().catch(()=>{});
  }, 120);
}

// 依目前課程 id 訂閱/重訂閱
async function setupRealtimeAttendance(courseId){
  try{
    // 先取消舊的
    if (__rtChannel){
      await sb.removeChannel(__rtChannel);
      __rtChannel = null;
    }
    if (!courseId) return;

    // 只聽當前課程的異動
    __rtChannel = sb
      .channel(`attendance-${courseId}`)
      .on(
        'postgres_changes',
        {
          event: '*',          // INSERT/UPDATE/DELETE
          schema: 'public',
          table: 'attendance',
          filter: `course_id=eq.${courseId}`
        },
        () => {
          // 有變更 → 重新撈名單 + 統計（用防抖避免抖動）
          scheduleRealtimeRefresh();
        }
      )
      .subscribe((status, err) => {
        if (status === 'CHANNEL_ERROR' || status === 'TIMED_OUT') {
          console.warn('Realtime attendance 訂閱異常：', status, err);
        }
      });
  }catch(e){
    console.error('setupRealtimeAttendance 失敗：', e);
  }
}

    function getFilteredStudents(){
  const q = (studentSearch?.value || '').trim().toLowerCase();
  let list = __studentsCache;

  if (q){
    list = list.filter(s =>
      (s.team||'').toLowerCase().includes(q) ||
      (s.function||'').toLowerCase().includes(q) ||
      (s.name||'').toLowerCase().includes(q) ||
      (s.employee_no||'').toLowerCase().includes(q)
    );
  }

  if (__selectedFunction !== null){
    list = list.filter(s => (s.function||'').trim() === __selectedFunction);
  }

  const collator = new Intl.Collator('en', { sensitivity: 'base' });
  list = list.slice().sort((a,b)=>{
    const byName = collator.compare(a.name||'', b.name||'');
    if (byName !== 0) return byName;
    return collator.compare(a.employee_no||'', b.employee_no||'');
  });

  return list;
}

function renderStudentCards(){
  const all = getFilteredStudents();

  const totalItems = all.length;
  const totalPages = Math.max(1, Math.ceil(totalItems / PAGE_SIZE));

  // 若目前頁超出範圍，自動拉回有效頁
  if (__page > totalPages) __page = totalPages;
  if (__page < 1) __page = 1;

  const start = (__page - 1) * PAGE_SIZE;
  const pageItems = all.slice(start, start + PAGE_SIZE);

  studentCards.innerHTML = '';

  if (!pageItems.length){
    const el=document.createElement('div'); el.className='note';
    el.textContent = (studentSearch?.value || '').trim() ? '沒有符合搜尋的學員' : '尚未匯入學員名單';
    studentCards.appendChild(el);
    renderPager(totalPages, totalItems);
    return;
  }

  pageItems.forEach(s=>{
    const card=document.createElement('div');
    card.className='card-item' + ( __checkedSet.has(String(s.id))? ' checked':'' );
    card.dataset.sid = String(s.id);
    card.innerHTML = `
      <div class="row-top">
        <div class="avatar">${escapeHtml(getInitials(s.name, s.employee_no))}</div>
        <div style="margin-left:6px"><b>${escapeHtml(s.name||'')}</b></div>
        ${__checkedSet.has(String(s.id)) ? '<span class="chip-ok" style="margin-left:auto">已報到</span>' : ''}
      </div>`;

    card.addEventListener('click', async ()=>{
      if (!__currentCourseId){ showAlert('請先選擇課程'); return; }
      if (!__allowCheckin){
        showAlert('這堂課不是今天，僅供預覽名單，無法報到');
        return;
      }
      if (__checkedSet.has(String(s.id))) return;  // 已報到：靜默忽略
      if (__isSubmitting) return;
      // 防誤點: 報到前確認身分 (與 Mobile.html 同款)
      if (!(await confirmCheckinIdentity(s))) return;
      __isSubmitting = true;
      try{
        await doCheckin(__currentCourseId, s, { allowCheckin: __allowCheckin });

        __checkedSet.add(String(s.id));
        card.classList.add('checked');
        if (!card.querySelector('.chip-ok')){
          const ok=document.createElement('span');
          ok.className='chip-ok'; ok.textContent='已報到'; ok.style.marginLeft='auto';
          card.querySelector('.row-top').appendChild(ok);
        }
        updateTodayStats();

      }catch(e){
        const isDupe = /duplicate key|unique constraint/i.test(e?.message || '');
        if (isDupe){
          // DB 重複報到：靜默更新本地 UI 即可
          __checkedSet.add(String(s.id));
          card.classList.add('checked');
          if (!card.querySelector('.chip-ok')){
            const ok=document.createElement('span');
            ok.className='chip-ok'; ok.textContent='已報到'; ok.style.marginLeft='auto';
            card.querySelector('.row-top').appendChild(ok);
          }
        } else {
          showAlert('報到失敗：' + (e?.message || e));
        }
      }
      finally{ __isSubmitting = false; }
    });

    studentCards.appendChild(card);
  });

  renderPager(totalPages, totalItems);
}

  btnCreateStudent?.addEventListener('click', async()=>{
  const team=(inpTeam?.value||'').trim(), fn=(inpFunction?.value||'').trim(), name=(inpName?.value||'').trim(), emp=(inpEmp2?.value||'').trim();
  const course_id = selCourseToday?.value;

  __isSubmitting = true;

  try{
    // 要求 PostgREST 回傳剛插入的資料
    let ins = await rest('/rest/v1/students?select=*', {
      method:'POST',
      headers: { 'Prefer': 'return=representation' },
      body: JSON.stringify({ team, function: fn||null, name, employee_no: emp })
    });

    // 兼容回傳型態：可能是陣列或物件；也可能為 null（某些設定）
    let created = Array.isArray(ins) ? ins[0] : ins;

    // 如果仍拿不到，做一次 fallback 查詢（以 employee_no 撈）
    if (!created?.id) {
      const rows = await rest('/rest/v1/students?select=*&employee_no=eq.' + encodeURIComponent(emp));
      created = Array.isArray(rows) ? rows[0] : rows;
    }

    if (!created?.id) {
      throw new Error('建立學員後無法取得 id（可能是 RLS 或回傳設定問題）');
    }

    await doCheckin(course_id, created, { allowCheckin: __allowCheckin });

    __checkedSet.add(String(created.id));

  /** Supabase 分頁全撈，避免 PostgREST 單次回傳上限把資料截斷 */
  async function fetchAllRows(path, pageSize=1000){
    const out = [];
    for (let offset=0; ; offset+=pageSize){
      const rows = await rest(`${path}&limit=${pageSize}&offset=${offset}`);

  }

  /** 最小 xlsx 產生器：自組 OOXML + zip，無外部依賴（不走 CDN） */
  async function buildXlsx(sheets){
    const enc = new TextEncoder();
    const esc = v => String(v ?? '')
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')
      .replace(/[\x00-\x08\x0B\x0C\x0E-\x1F]/g,'');
    const colName = i => { let s=''; i++; while(i>0){ const m=(i-1)%26; s=String.fromCharCode(65+m)+s; i=(i-m-1)/26; } return s; };
    const cell = (v, r, ci, style) => {
      const ref = colName(ci) + r;
      if (typeof v === 'number') return `<c r="${ref}"${style?` s="${style}"`:''}><v>${v}</v></c>`;
      return `<c r="${ref}"${style?` s="${style}"`:''} t="inlineStr"><is><t xml:space="preserve">${esc(v)}</t></is></c>`;
    };
    const sheetXml = (header, data, widths) => {
      const lines = [`<row r="1">${header.map((h,i)=> cell(h,1,i,1)).join('')}</row>`];
      data.forEach((rw, ri)=>{
        const r = ri + 2;
        lines.push(`<row r="${r}">${rw.map((v,i)=> cell(v,r,i)).join('')}</row>`);
      });
      const dim = `A1:${colName(header.length-1)}${data.length+1}`;
      return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><dimension ref="${dim}"/><sheetViews><sheetView workbookViewId="0"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews><sheetFormatPr defaultRowHeight="15"/><cols>${widths.map((w,i)=>`<col min="${i+1}" max="${i+1}" width="${w}" customWidth="1"/>`).join('')}</cols><sheetData>${lines.join('')}</sheetData><autoFilter ref="${dim}"/></worksheet>`;
    };

    const parts = sheets.map(s => ({ name: s.name, xml: sheetXml(s.header, s.data, s.widths) }));

    const styles = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><fonts count="2"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="11"/><color rgb="FFFFFFFF"/><name val="Calibri"/></font></fonts><fills count="3"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill><fill><patternFill patternType="solid"><fgColor rgb="FF0070C0"/><bgColor indexed="64"/></patternFill></fill></fills><borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="2"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="0" fontId="1" fillId="2" borderId="0" xfId="0" applyFont="1" applyFill="1"/></cellXfs></styleSheet>`;

    const files = [
      ['[Content_Types].xml', `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>${parts.map((_,i)=>`<Override PartName="/xl/worksheets/sheet${i+1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join('')}<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/></Types>`],
      ['_rels/.rels', `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>`],
      ['xl/workbook.xml', `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>${parts.map((s,i)=>`<sheet name="${esc(s.name)}" sheetId="${i+1}" r:id="rId${i+1}"/>`).join('')}</sheets></workbook>`],
      ['xl/_rels/workbook.xml.rels', `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">${parts.map((_,i)=>`<Relationship Id="rId${i+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i+1}.xml"/>`).join('')}<Relationship Id="rId${parts.length+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>`],
      ['xl/styles.xml', styles],
      ...parts.map((s,i)=> [`xl/worksheets/sheet${i+1}.xml`, s.xml]),
    ];

    // ── zip 打包：優先 deflate-raw，瀏覽器不支援時退回 stored（不壓縮，仍是合法 zip）──
    const crcTable = (()=>{
      const t = new Int32Array(256);
      for (let n=0;n<256;n++){ let c=n; for(let k=0;k<8;k++) c = (c & 1) ? (0xEDB88320 ^ (c>>>1)) : (c>>>1); t[n]=c; }
      return t;
    })();
    const crc32 = buf => { let c=-1; for(let i=0;i<buf.length;i++) c = crcTable[(c ^ buf[i]) & 0xFF] ^ (c>>>8); return (c ^ -1) >>> 0; };
    const canDeflate = typeof CompressionStream === 'function';
    const deflateRaw = async u8 => {
      const stream = new Blob([u8]).stream().pipeThrough(new CompressionStream('deflate-raw'));
      return new Uint8Array(await new Response(stream).arrayBuffer());
    };

    const now = new Date();
    const dosTime = (now.getHours()<<11) | (now.getMinutes()<<5) | (now.getSeconds()>>1);
    const dosDate = ((now.getFullYear()-1980)<<9) | ((now.getMonth()+1)<<5) | now.getDate();

    const chunks = [], centrals = [];
    let offset = 0;
    for (const [name, content] of files){
      const nameBuf = enc.encode(name);
      const raw = enc.encode(content);
      const comp = canDeflate ? await deflateRaw(raw) : raw;
      const method = canDeflate ? 8 : 0;
      const crc = crc32(raw);

      const lh = new DataView(new ArrayBuffer(30));
      lh.setUint32(0, 0x04034b50, true); lh.setUint16(4, 20, true); lh.setUint16(6, 0x0800, true);
      lh.setUint16(8, method, true); lh.setUint16(10, dosTime, true); lh.setUint16(12, dosDate, true);
      lh.setUint32(14, crc, true); lh.setUint32(18, comp.length, true); lh.setUint32(22, raw.length, true);
      lh.setUint16(26, nameBuf.length, true); lh.setUint16(28, 0, true);
      chunks.push(new Uint8Array(lh.buffer), nameBuf, comp);

      const ch = new DataView(new ArrayBuffer(46));
      ch.setUint32(0, 0x02014b50, true); ch.setUint16(4, 20, true); ch.setUint16(6, 20, true);
      ch.setUint16(8, 0x0800, true); ch.setUint16(10, method, true);
      ch.setUint16(12, dosTime, true); ch.setUint16(14, dosDate, true);
      ch.setUint32(16, crc, true); ch.setUint32(20, comp.length, true); ch.setUint32(24, raw.length, true);
      ch.setUint16(28, nameBuf.length, true); ch.setUint32(42, offset, true);
      centrals.push(new Uint8Array(ch.buffer), nameBuf);

      offset += 30 + nameBuf.length + comp.length;
    }
    const cdSize = centrals.reduce((n,b)=> n + b.length, 0);
    const eocd = new DataView(new ArrayBuffer(22));
    eocd.setUint32(0, 0x06054b50, true);
    eocd.setUint16(8, files.length, true); eocd.setUint16(10, files.length, true);
    eocd.setUint32(12, cdSize, true); eocd.setUint32(16, offset, true);

    return new Blob([...chunks, ...centrals, new Uint8Array(eocd.buffer)],
      { type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
  }

  async function exportAttendanceXlsx(){
    const btn = btnExportAttend;
    const label = btn ? btn.textContent : '';
    if (btn){ btn.disabled = true; btn.textContent = '匯出中…'; }
    try{
      const [courses, attendance, students] = await Promise.all([
        fetchAllRows('/rest/v1/courses?select=id,title,date,dept,start_time,end_time,room&order=date.asc'),
        fetchAllRows('/rest/v1/attendance?select=course_id,student_id,checked_in_at&order=checked_in_at.asc'),
        fetchAllRows('/rest/v1/students?select=id,team,function,name,employee_no&order=team.asc'),
      ]);
      if (!attendance.length){ showAlert('沒有可匯出的出席資料'); return; }

      const courseMap = new Map(courses.map(c=> [c.id, c]));
      const stuMap    = new Map(students.map(s=> [s.id, s]));
      const hhmm = t => t ? String(t).slice(0,5) : '';
      const tpe = iso => {                       // UTC → 台北時間顯示字串
        if (!iso) return '';
        const s = new Date(new Date(iso).getTime() + 8*3600*1000).toISOString();
        return s.slice(0,10) + ' ' + s.slice(11,16);
      };

      // 表一：一列一筆報到
      const rows = attendance.map(a=>{
        const c = courseMap.get(a.course_id) || {};
        const s = stuMap.get(a.student_id) || {};
        return [
          c.date || '', c.title || '(課程已刪除)', c.dept || '',
          c.start_time ? `${hhmm(c.start_time)}-${hhmm(c.end_time)}` : '', c.room || '',
          s.team || '', s.function || '', s.name || '(學員已刪除)', s.employee_no || '',
          tpe(a.checked_in_at),
        ];
      }).sort((a,b)=>
        a[0].localeCompare(b[0]) || a[1].localeCompare(b[1]) ||
        a[5].localeCompare(b[5]) || a[7].localeCompare(b[7]));

      // 表二：每堂課報到人數
      const perCourse = new Map();
      for (const a of attendance) perCourse.set(a.course_id, (perCourse.get(a.course_id)||0) + 1);
      const byCourse = courses.map(c=> [
        c.date || '', c.title || '', c.dept || '',
        c.start_time ? `${hhmm(c.start_time)}-${hhmm(c.end_time)}` : '', c.room || '',
        perCourse.get(c.id) || 0,
      ]).sort((a,b)=> String(a[0]).localeCompare(String(b[0])) || String(a[1]).localeCompare(String(b[1])));

      // 表三：每位學員上課堂數
      const perStudent = new Map();
      for (const a of attendance) perStudent.set(a.student_id, (perStudent.get(a.student_id)||0) + 1);
      const byStudent = [...perStudent.entries()].map(([sid, n])=>{
        const s = stuMap.get(sid) || {};
        return [s.team || '', s.function || '', s.name || '(學員已刪除)', s.employee_no || '', n];
      }).sort((a,b)=> b[4]-a[4] || String(a[0]).localeCompare(String(b[0])) || String(a[2]).localeCompare(String(b[2])));

      const blob = await buildXlsx([
        { name:'上課名單',
          header:['日期','課程名稱','部門','時間','教室','Team','Function','姓名','工號','報到時間'],
          data: rows, widths:[12,32,8,14,14,10,12,20,12,18] },
        { name:'課程統計',
          header:['日期','課程名稱','部門','時間','教室','報到人數'],
          data: byCourse, widths:[12,32,8,14,14,11] },
        { name:'學員統計',
          header:['Team','Function','姓名','工號','上課堂數'],
          data: byStudent, widths:[10,12,20,12,11] },
      ]);

      const pad = n => String(n).padStart(2,'0');
      const d = new Date();
      const ts = `${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}${pad(d.getHours())}${pad(d.getMinutes())}${pad(d.getSeconds())}`;
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `CQE上課名單_${ts}_(Security C).xlsx`;
      a.click();
      setTimeout(()=> URL.revokeObjectURL(a.href), 1000);
    }catch(e){
      showAlert('匯出失敗：' + (e?.message || e));
    }finally{
      if (btn){ btn.disabled = false; btn.textContent = label; }
    }
  }

  async function loadStackedChart(){
    if (!state.access_token) return;

    await ensureChartJs();

    const ChartCtor = (typeof Chart === 'function') ? Chart : (window.Chart?.Chart || window.Chart);
    if (!ChartCtor || typeof ChartCtor !== 'function'){
      console.error('Chart.js not ready:', window.Chart);
      return;
    }

    const canvas = document.getElementById('chart');
    if (!canvas) return;

    if ((canvas.offsetWidth || canvas.getBoundingClientRect().width) <= 0){
      requestAnimationFrame(loadStackedChart);
      return;
    }

    function setMsg(txt){
      let m = document.getElementById('chartMsg');
      if (!m){ m = document.createElement('div'); m.id='chartMsg'; m.className='note'; m.style.marginTop='6px'; canvas.parentNode.insertBefore(m, canvas.nextSibling); }
      m.textContent = txt || '';
    }
    setMsg('載入資料中…');

    try{
      const courses = await rest('/rest/v1/courses?select=id,title,date&order=date.asc', { auth:true });
      if (!Array.isArray(courses) || !courses.length){ clearChart(); setMsg('目前沒有課程可顯示'); const k = document.getElementById('chartKpi'); if (k) k.textContent = '0'; const ck = document.getElementById('chartCourseKpi'); if (ck) ck.textContent = '0'; document.getElementById('chartLegend').innerHTML=''; return; }

      const attends = await rest('/rest/v1/attendance?select=course_id,student_id', { auth:true });
      // 2026-07-11 Astrid 定案: 堆疊分類從 team 改為 function
      const stuRows = await rest('/rest/v1/students?select=id,function&limit=20000', { auth:true });
      const id2team = new Map((stuRows||[]).map(s => [s.id, s.function || '未分類']));

      const mode = window.__chartMode || 'daily';
      const labelByCourse = new Map(), labels=[];
      const seenLab = new Set();
      courses.forEach(c=>{
        const lab = mode==='month' ? String(c.date||'').slice(0,7) : `${c.date} ${c.title}`;
        labelByCourse.set(c.id, lab);
        if (!seenLab.has(lab)){ seenLab.add(lab); labels.push(lab); }
      });

      const teamSet = new Set(), counts = {}, uniq = {};
      function ensureTeam(t){ if(!counts[t]) counts[t]={}; teamSet.add(t); }

      (attends||[]).forEach(r=>{
        const lab = labelByCourse.get(r.course_id); if (!lab) return;
        const team = id2team.get(r.student_id) || '未分類';
        ensureTeam(team);
        const key = `${team}::${r.course_id}::${r.student_id}`;
        if (!uniq[key]){ uniq[key]=true; counts[team][lab] = (counts[team][lab]||0) + 1; }
      });

      const datasets = [];
      const sortedTeams = Array.from(teamSet).sort();
      const palette = CHART_PALETTE;
      const chartFont = getComputedStyle(document.documentElement).getPropertyValue('--font').trim() || 'sans-serif';

      function lighten(hex, amt){
        const n = parseInt(hex.replace('#',''), 16);
        const r = Math.min(255, Math.max(0, (n>>16) + amt));
        const g = Math.min(255, Math.max(0, (n>>8 & 255) + amt));
        const b = Math.min(255, Math.max(0, (n & 255) + amt));
        return '#' + [r,g,b].map(v=>v.toString(16).padStart(2,'0')).join('');
      }
      // 超過色盤長度 (16) 時第二輪起自動加深/加淺，避免撞色
      const teamColors = sortedTeams.map((team, i)=>{
        const cycle = Math.floor(i / palette.length);
        const base = palette[i % palette.length];
        return cycle === 0 ? base : lighten(base, cycle % 2 === 1 ? -30*cycle : 25*cycle);
      });

      // 每根柱子的圓角只給「實際有值且未被圖例隱藏」的最上/最下色層, 不能綁死在固定班級
      function stackEdge(ctx, wantTop){
        const c = ctx.chart, col = ctx.dataIndex;
        const barIdxs = c.data.datasets
          .map((d, di)=> d.type==='bar' ? di : -1)
          .filter(di=> di>=0 && c.getDatasetMeta(di).hidden !== true && (c.data.datasets[di].data[col]||0) > 0);
        if (!barIdxs.length) return false;
        return ctx.datasetIndex === (wantTop ? barIdxs[barIdxs.length-1] : barIdxs[0]);
      }

      sortedTeams.forEach((team, i)=>{
        const color = teamColors[i];
        datasets.push({
          type: 'bar',
          label: team,
          data: labels.map(l => counts[team]?.[l] || 0),
          backgroundColor: color,
          hoverBackgroundColor: lighten(color, 35),
          borderColor:     color,
          borderWidth: 0,
          borderSkipped: false,
          borderRadius: (ctx)=>{
            const r = 8;
            const top = stackEdge(ctx, true), bottom = stackEdge(ctx, false);
            return { topLeft: top?r:0, topRight: top?r:0, bottomLeft: bottom?r:0, bottomRight: bottom?r:0 };
          },
          barPercentage: 1,
          categoryPercentage: 0.7,
          order: 1
        });
      });

      const totals = labels.map(lab => sortedTeams.reduce((s,t)=> s + (counts[t]?.[lab]||0), 0));
      const grandTotal = totals.reduce((a,b)=> a+b, 0);
      const kpiEl = document.getElementById('chartKpi');
      if (kpiEl) kpiEl.textContent = grandTotal;
      const courseKpiEl = document.getElementById('chartCourseKpi');
      if (courseKpiEl) courseKpiEl.textContent = courses.length;

      function renderChartLegend(){
        const box = document.getElementById('chartLegend');
        if (!box) return;
        box.innerHTML = sortedTeams.map((team, i)=>{
          const color = teamColors[i];
          return `<button type="button" class="chart-legend-chip" data-team="${escapeHtml(team)}"
            style="background:${color}17;border-color:${color}40;color:${color}">
            <span class="dot" style="background:${color}"></span>${escapeHtml(team)}</button>`;
        }).join('');
        box.querySelectorAll('.chart-legend-chip').forEach((chip, i)=>{
          chip.addEventListener('click', ()=>{
            const meta = chart.getDatasetMeta(i);
            meta.hidden = meta.hidden === null ? !chart.data.datasets[i].hidden : !meta.hidden;
            chip.classList.toggle('is-hidden', !!meta.hidden);
            chart.update();
          });
        });
      }
      // Total 不畫線不畫點 (2026-07-11 Astrid 定案), 只留柱頂數字標籤與 tooltip 的 Total 項
      datasets.push({
        type: 'line',
        label: 'Total',
        data: totals,
        showLine: false,
        borderWidth: 0,
        backgroundColor: '#EFF1F8',
        pointRadius: 0,
        pointHoverRadius: 0,
        fill: false,
        yAxisID: 'y',
        order: 9999,
        clip: false,
        isTotal: true
      });



      const yMax = Math.ceil(Math.max(0, ...totals) * 1.2) || 5;

      if (chart) {
        chart.data.labels = labels;
        chart.data.datasets = datasets;
        chart.options.scales.y.max = yMax;
        chart.update();
        renderChartLegend();
        setMsg('');
        return;
      }
      const ctx = canvas.getContext('2d');
      chart = new ChartCtor(ctx, {
        type: 'bar',
        data: { labels, datasets },
        options: {
          responsive: true,
          animation: { duration: 600, easing: 'easeOutQuart' },
          interaction: { mode: 'index', intersect: false },
          scales: {
            x: {
              stacked: true,
              grid: { display: false },
              border: { display: false },
              ticks: {
                color: '#A2AAC0',
                font: { size: 11, family: chartFont },
                callback: function(value, index){
                  const full = this.chart?.data?.labels?.[index] ?? '';
                  const mm = /^(\d{4})-(\d{2})$/.exec(full);
                  if (mm) return parseInt(mm[1],10) + '/' + parseInt(mm[2],10);
                  const m = /(\d{4})-(\d{2})-(\d{2})/.exec(full);
                  if (m) return parseInt(m[2],10) + '/' + parseInt(m[3],10);
                  return full.length > 12 ? full.slice(0,12) + '\u2026' : full;
                }
              }
            },
            y: {
              stacked: true,
              beginAtZero: true,
              max: yMax,
              border: { display: false },
              grid: { color: 'rgba(255,255,255,0.06)', drawTicks: false },
              ticks: { color: '#A2AAC0', font: { size: 11, family: chartFont }, padding: 8 }
            }
          },
          plugins: {
            legend: { display: false },
            tooltip: {
              backgroundColor: 'rgba(10,10,13,0.92)',
              borderColor: 'rgba(91,184,255,0.35)',
              borderWidth: 1,
              titleColor: '#EFF1F8',
              bodyColor: '#A2AAC0',
              padding: 10,
              cornerRadius: 10,
              titleFont: { family: chartFont },
              bodyFont: { family: chartFont },
              usePointStyle: true,
              boxWidth: 8,
              boxHeight: 8,
              boxPadding: 6,
              filter: (item)=> (item.parsed?.y || 0) > 0,
              itemSort: (a,b)=> (b.dataset.isTotal?1:0) - (a.dataset.isTotal?1:0),
              callbacks: {
                title(items){ return items[0]?.label ?? ''; },
                label(item){ return ' ' + item.dataset.label + ': ' + item.parsed.y; }
              }
            }
          }
        },
        plugins: [chartAreaBgPlugin, badgeLabelPlugin]
      });

      renderChartLegend();
      setMsg('');
    }catch(e){
      clearChart();
      setMsg('圖表載入失敗：' + (e?.message || e));
      console.error(e);
    }
  }

  async function exportTodayAttendance(){
    if (!state.access_token){ showAlert('請先登入後再匯出'); return; }
    const today = todayStr();

    const courses = await rest(`/rest/v1/courses?select=id,title,date,start_time,end_time&date=eq.${today}&order=start_time.asc`, { auth:true });
    if (!courses?.length){ showAlert(`今天（${today}）沒有課程`); return; }

    let chosen = courses[0];
    if (courses.length > 1){
      const list = courses.map((c,i)=> `${i+1}. ${c.title} ${c.start_time?c.start_time.slice(0,5):''}~${c.end_time?c.end_time.slice(0,5):''}`).join('\n');
      const fv = await showFormModal({ title:'選擇要匯出的課程', fields:[
        { key:'idx', label:`今天共有 ${courses.length} 門課，請輸入編號：\n${list}`, value:'', placeholder:'例如 1' }
      ]});
      const ans = fv ? fv.idx : null;
      const idx = parseInt(ans,10);
      if (!(idx>=1 && idx<=courses.length)){ showAlert('已取消匯出'); return; }
      chosen = courses[idx-1];
    }

    const rows = await rest(`/rest/v1/attendance?select=student_id&course_id=eq.${encodeURIComponent(chosen.id)}`, { auth:true });
    const ids = Array.from(new Set((rows||[]).map(r=> r.student_id)));
    if (!ids.length){ showAlert('沒有出席紀錄'); return; }

    const idList = '(' + ids.join(',') + ')';
    const students = await rest(`/rest/v1/students?select=id,team,name,employee_no&id=in.${encodeURIComponent(idList)}`, { auth:true });

    const seen = new Set(); const out = [];
    (students||[]).forEach(s=>{
      if (seen.has(s.id)) return; seen.add(s.id);
      out.push({ team:s.team||'', name:s.name||'', employee_no:s.employee_no||'' });
    });

    const csvCell = (v)=>{ let s = (v==null? '' : String(v)); return /[",\n]/.test(s) ? `"${s.replace(/"/g,'""')}"` : s; };
    const sanitize = (s)=> String(s||'').replace(/[\\/:*?"<>|]+/g,'_');

    const header = 'Team,Name(EN),ID\n';
    const body = out.map(s=> `${csvCell(s.team)},${csvCell(s.name)},${csvCell(s.employee_no)}`).join('\n');
    const csv = header + body + '\n';

    const blob = new Blob([csv], { type:'text/csv;charset=utf-8;' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `${today}_${sanitize(chosen.title)}_attendance.csv`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(a.href);
  }

function renderBackfillTable(q = '') {
  backfillTbody.innerHTML = '';

  // 關鍵字處理：支援空白或逗號切割多關鍵字
  const kw = String(q || '').trim().toLowerCase();
  const terms = kw ? kw.split(/[\s,]+/).filter(Boolean) : [];

  // 篩選
  let list = __bf_students.slice();
  if (terms.length) {
    list = list.filter(s => {
      const hay = `${s.team || ''} ${s.name || ''} ${s.employee_no || ''}`.toLowerCase();
      return terms.every(t => hay.includes(t));
    });
  }

  // 沒資料
  if (!list.length) {
    const tr = document.createElement('tr');
    tr.innerHTML = `<td colspan="4" class="note" style="padding:10px">沒有符合的學員</td>`;
    backfillTbody.appendChild(tr);
    backfillMsg.textContent = '沒有符合的學員。';
    backfillMsg.className = 'note';
    return;
  }

  // 建列
  const frag = document.createDocumentFragment();
  list.forEach(s => {
    const already = __bf_checked.has(s.id);   // 此課程已經報到
    const willAdd = __bf_toAdd.has(s.id);     // 這次準備補登

    const tr = document.createElement('tr');
    tr.style.background = 'var(--core-2)';
    tr.style.border = '1px solid var(--border)';

    // 4 欄：Team / Name / ID / 狀態/選取
    const tdTeam = document.createElement('td');
    const tdName = document.createElement('td');
    const tdId   = document.createElement('td');
    const tdAct  = document.createElement('td');

    [tdTeam, tdName, tdId, tdAct].forEach(td => {
      td.style.padding = '8px 10px';
      td.style.borderTop = '1px solid var(--border)';
      td.style.borderBottom = '1px solid var(--border)';
    });

    tdTeam.textContent = s.team || '';
    tdName.textContent = s.name || '';
    tdId.textContent   = s.employee_no || '';
    tdAct.style.textAlign = 'center';

    if (already) {
      // 已報到者：徽章 + 可勾選「取消報到」
      const chip = document.createElement('span');
      chip.className = 'chip chip-ok';
      chip.textContent = '已報到';
      tdAct.appendChild(chip);

      const label = document.createElement('label');
      label.style.cursor = 'pointer';
      label.style.marginLeft = '10px';
      label.style.color = 'var(--danger)';
      label.style.fontSize = '12px';
      const cb = document.createElement('input');
      cb.type = 'checkbox';
      cb.checked = __bf_toRemove.has(s.id);
      cb.addEventListener('change', () => {
        if (cb.checked) __bf_toRemove.add(s.id);
        else __bf_toRemove.delete(s.id);
        updateBackfillMsg();
      });
      label.append(cb);
      label.append(document.createTextNode(' 取消報到'));
      tdAct.appendChild(label);
    } else {
      // 可補登：提供勾選
      const label = document.createElement('label');
      label.style.cursor = 'pointer';
      const cb = document.createElement('input');
      cb.type = 'checkbox';
      cb.checked = willAdd;
      cb.addEventListener('change', () => {
        if (cb.checked) __bf_toAdd.add(s.id);
        else __bf_toAdd.delete(s.id);
        updateBackfillMsg();
      });
      label.append(cb);
      label.append(document.createTextNode(' 勾選補登'));
      tdAct.appendChild(label);
    }

    tr.append(tdTeam, tdName, tdId, tdAct);

    // 圓角（左右）
    tr.firstElementChild.style.borderLeft = '1px solid var(--border)';
    tr.firstElementChild.style.borderTopLeftRadius = '10px';
    tr.firstElementChild.style.borderBottomLeftRadius = '10px';
    tr.lastElementChild.style.borderRight = '1px solid var(--border)';
    tr.lastElementChild.style.borderTopRightRadius = '10px';
    tr.lastElementChild.style.borderBottomRightRadius = '10px';

    frag.appendChild(tr);
  });

  backfillTbody.appendChild(frag);
  updateBackfillMsg();
}

  if (__bf_toRemove.size) parts.push(`待取消報到 ${__bf_toRemove.size} 位`);
  backfillMsg.textContent = parts.join('，') + '。';
  backfillMsg.className = 'note';
}

function buildStuRow(s){
  const tr = document.createElement('tr');
  tr.style.background = 'var(--core-2)';
  tr.style.border = '1px solid var(--border)';

  tr.innerHTML = `
    <td style="padding:8px 10px;border-top:1px solid var(--border);border-bottom:1px solid var(--border)">${escapeHtml(s.function||'')}</td>
    <td style="padding:8px 10px;border-top:1px solid var(--border);border-bottom:1px solid var(--border)">${escapeHtml(s.team||'')}</td>
    <td style="padding:8px 10px;border-top:1px solid var(--border);border-bottom:1px solid var(--border)">${escapeHtml(s.name||'')}</td>
    <td style="padding:8px 10px;border-top:1px solid var(--border);border-bottom:1px solid var(--border)">${escapeHtml(s.employee_no||'')}</td>
    <td style="padding:8px 10px;text-align:center;border-top:1px solid var(--border);border-bottom:1px solid var(--border)">
      <div class="row" style="justify-content:center">
        <button class="ghost btn-stu-edit">編輯</button>
        <button class="ghost btn-stu-del">刪除</button>
      </div>
    </td>
  `;

  // 圓角（左右）
  tr.firstElementChild.style.borderLeft = '1px solid var(--border)';
  tr.firstElementChild.style.borderTopLeftRadius = '10px';
  tr.firstElementChild.style.borderBottomLeftRadius = '10px';
  tr.lastElementChild.style.borderRight = '1px solid var(--border)';
  tr.lastElementChild.style.borderTopRightRadius = '10px';
  tr.lastElementChild.style.borderBottomRightRadius = '10px';

  // 綁定操作
  tr.querySelector('.btn-stu-edit')?.addEventListener('click', ()=> editStudentAdmin(s));
  tr.querySelector('.btn-stu-del')?.addEventListener('click', ()=> deleteStudentAdmin(s));
  return tr;
}

function renderStuTable(rows){
  stuTbody.innerHTML = '';
  if (!rows?.length){
    const tr = document.createElement('tr');
    tr.innerHTML = `<td colspan="5" class="note" style="padding:10px">沒有符合的學員</td>`;
    stuTbody.appendChild(tr);
    return;
  }
  rows.forEach(r => stuTbody.appendChild(buildStuRow(r)));
}

function renderStuPager(total, pageSize, page){
  stuPager.innerHTML = '';
  const totalPages = Math.max(1, Math.ceil(total / pageSize));
  const info = document.createElement('span');
  info.className = 'note';
  info.textContent = `第 ${page} / ${totalPages} 頁（Total: ${total} 筆）`;
  const prev = document.createElement('button');
  prev.className='icon-btn';
  prev.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
  prev.disabled = page<=1;
  prev.addEventListener('click', ()=>{ __stu_page = Math.max(1, __stu_page-1); loadStudentsAdmin(); });

  const next = document.createElement('button');
  next.className='icon-btn';
  next.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
  next.disabled = page>=totalPages;
  next.addEventListener('click', ()=>{ __stu_page = Math.min(totalPages, __stu_page+1); loadStudentsAdmin(); });

  stuPager.append(prev, info, next);
}

async function loadStudentsAdmin(reset=false){
  if (!state.access_token){
    setStuMsg('請先在【登入】分頁完成登入。','note warn');
    renderStuTable([]);
    stuPager.innerHTML = '';
    return;
  }
  if (reset) __stu_page = 1;

  const q = (stuQuery?.value || '').trim();
  setStuMsg('載入中…','note');

  // 組搜尋與分頁參數
  const like   = (s)=> `*${encodeURIComponent(s)}*`;
  const orExpr = q ? `&or=(team.ilike.${like(q)},name.ilike.${like(q)},employee_no.ilike.${like(q)})` : '';
  const from   = ((__stu_page - 1) * STU_PAGE_SIZE);

  try{
    const { rows, total } = await restWithCount(
      `/rest/v1/students?select=*&order=${encodeURIComponent(__stu_sortKey)}.${encodeURIComponent(__stu_sortDir)}.nullslast${orExpr}`,
      { auth:true, limit: STU_PAGE_SIZE, offset: from }
    );

    __stu_rows  = Array.isArray(rows) ? rows : [];
    __stu_total = typeof total === 'number' ? total : __stu_rows.length;

    renderStuTable(__stu_rows);
    renderStuPager(__stu_total, STU_PAGE_SIZE, __stu_page);
    setStuMsg(`共 ${__stu_total} 名（This Page: ${__stu_rows.length} 筆）`, 'note');
    updateStuSortIcons();
  }catch(e){
    setStuMsg('載入失敗：' + (e?.message || e), 'note error');
    renderStuTable([]);
    stuPager.innerHTML = '';
  }
}


// === 新增：表頭排序控制 ===
function updateStuSortIcons(){
  const ths = stuTable?.querySelectorAll('thead th[data-sort]');
  if (!ths) return;
  ths.forEach(th=>{
    const key = th.getAttribute('data-sort');
    const icon = th.querySelector('.sort-icon');
    if (!icon) return;
    if (key === __stu_sortKey){
      icon.textContent = (__stu_sortDir === 'asc') ? '▲' : '▼';
      icon.style.opacity = '1';
    }else{
      icon.textContent = '';
      icon.style.opacity = '.7';
    }
  });
}

function initStuSortHeaders(){
  const ths = stuTable?.querySelectorAll('thead th[data-sort]');
  if (!ths) return;
  ths.forEach(th=>{
    th.addEventListener('click', ()=>{
      const key = th.getAttribute('data-sort');
      if (!key) return;
      if (__stu_sortKey === key){
        __stu_sortDir = (__stu_sortDir === 'asc') ? 'desc' : 'asc';
      }else{
        __stu_sortKey = key;
        __stu_sortDir = 'asc';
      }
      updateStuSortIcons();
      loadStudentsAdmin(true); // 重新查詢並回到第 1 頁
    });
  });

  updateStuSortIcons();
}

// ── 匯出學員名單 ─────────────────────────────────────────────────────────────────
btnExportStudents?.addEventListener('click', async ()=>{
  if (!state.access_token){ setStuMsg('請先登入。','note warn'); return; }
  setStuMsg('匯出中…','note');
  try{
    const rows = await rest('/rest/v1/students?select=*&order=team.asc.nullslast,name.asc.nullslast&limit=2000', { auth:true });
    if (!Array.isArray(rows)||!rows.length){ setStuMsg('沒有學員資料可匯出。','note warn'); return; }
    const esc = v=> `"${String(v||'').replace(/"/g,'""')}"`;
    const lines = ['\uFEFFTeam,Function,Name(EN),ID'];
    rows.forEach(r=> lines.push([esc(r.team),esc(r.function),esc(r.name),esc(r.employee_no)].join(',')));
    const blob = new Blob([lines.join('\r\n')],{type:'text/csv;charset=utf-8;'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href=url; a.download='students_list.csv'; a.click();
    URL.revokeObjectURL(url);
    setStuMsg(`匯出完成：${rows.length} 筆。`,'note ok');
  }catch(e){ setStuMsg('匯出失敗：'+(e?.message||e),'note error'); }
});

// ── 匯入覆蓋 ─────────────────────────────────────────────────────────────────
btnImportOverwrite?.addEventListener('click', ()=>{ document.getElementById('fileOverwriteCsv')?.click(); });
document.getElementById('fileOverwriteCsv')?.addEventListener('change', async function(){
  const file = this.files?.[0];
  if (!file) return;
  this.value = '';  // 重置，方便下次選同一檔
  if (!state.access_token){ setStuMsg('請先登入後再匯入。','note warn'); return; }
  setStuMsg('解析中…','note');
  Papa.parse(file,{
    header:true,
    skipEmptyLines:true,
    complete: async (result)=>{
      const rows = result.data;
      if (!rows.length){ setStuMsg('CSV 無有效資料列。','note warn'); return; }
      const records = rows.map(r=>{
        const team = (r['Team']||r['team']||'').trim();
        const fn   = (r['Function']||r['function']||'').trim()||null;
        const name = (r['Name(EN)']||r['Name']||r['name']||'').trim();
        const emp  = (r['ID']||r['id']||r['employee_no']||'').trim();
        return { team, function:fn, name, employee_no:emp };
      }).filter(r=> r.name && r.employee_no);
      if (!records.length){ setStuMsg('找不到有效欄位（需要 Name(EN) 和 ID）。','note warn'); return; }
      setStuMsg(`準備覆蓋 ${records.length} 筆…`,'note');
      try{
        await rest('/rest/v1/students?on_conflict=employee_no',{
          method:'POST', auth:true,
          headers:{'Prefer':'resolution=merge-duplicates,return=minimal'},
          body: JSON.stringify(records)
        });
        setStuMsg(`覆蓋完成：${records.length} 筆（新增或更新）。`,'note ok');
        await loadStudentsAdmin(true);
        try{ await loadStudentsAndAttendance(); }catch{}
      }catch(e){ setStuMsg('覆蓋失敗：'+(e?.message||e),'note error'); }
    },
    error:(e)=>{ setStuMsg('CSV 解析失敗：'+(e?.message||e),'note error'); }
  });
});

async function createStudentAdmin(){
  if (!state.access_token) { showAlert('請先登入'); return; }
  const fv = await showFormModal({ title:'新增學員', fields:[
    { key:'team', label:'Team（組站）' },
    { key:'fn', label:'Function（職能，可空）' },
    { key:'name', label:'Name（英文）' },
    { key:'employee_no', label:'ID（工號）' }
  ]});
  if (fv === null) return;
  const { team, fn, name, employee_no } = fv;

  try{
    await rest('/rest/v1/students?select=*', {
      method:'POST', auth:true,
      headers:{ 'Prefer':'return=representation' },
      body: JSON.stringify({ team, function: fn||null, name, employee_no })
    });
    setStuMsg('新增成功','note ok');
    await loadStudentsAdmin(true);

    // 若當前停在學員報到頁，可同步刷新名單（不擾民地 try）
    try{ await loadStudentsAndAttendance(); }catch{}
  }catch(e){
    // 409 / unique constraint 時給友善訊息
    const msg = String(e?.message || '');
    if (e?.status===409 || /duplicate|unique/i.test(msg)){
      showAlert('新增失敗：ID 重複或唯一鍵衝突。');
    }else{
      showAlert('新增失敗：' + msg);
    }
  }
}

async function editStudentAdmin(s){
  if (!state.access_token) { showAlert('請先登入'); return; }
  const fv = await showFormModal({ title:'編輯學員', fields:[
    { key:'team', label:'Team（組站）', value:s.team || '' },
    { key:'fn', label:'Function（職能，可空）', value:s.function || '' },
    { key:'name', label:'Name（英文）', value:s.name || '' },
    { key:'employee_no', label:'ID（工號）', value:s.employee_no || '' }
  ]});
  if (fv === null) return;
  const { team, fn, name, employee_no } = fv;

  try{
    await rest(`/rest/v1/students?id=eq.${encodeURIComponent(s.id)}`, {
      method:'PATCH', auth:true,
      body: JSON.stringify({ team, function: fn||null, name, employee_no })
    });
    setStuMsg('更新成功','note ok');
    await loadStudentsAdmin();

    // 同步刷新學員報到頁的本地名單（非阻塞）
    try{ await loadStudentsAndAttendance(); }catch{}
  }catch(e){
    const msg = String(e?.message || '');
    if (e?.status===409 || /duplicate|unique/i.test(msg)){
      showAlert('更新失敗：ID 重複或唯一鍵衝突。');
    }else{
      showAlert('更新失敗：' + msg);
    }
  }
}

async function deleteStudentAdmin(s){
  if (!state.access_token) { showAlert('請先登入'); return; }

  const label = `${s.name || ''}（${s.employee_no || ''}）`;

  // 先確認是否刪除
  if (!(await showConfirm(`確定要刪除學員 ${label} ？`))) return;

  // 小工具：抓一個學員被多少出席紀錄參照
  async function countAttendanceOfStudent(studentId){
    try{
      const { rows, total } = await restWithCount(
        `/rest/v1/attendance?select=student_id&student_id=eq.${encodeURIComponent(studentId)}`,
        { auth:true, limit:1, offset:0 }
      );
      return typeof total === 'number' ? total : (rows?.length || 0);
    }catch(_){ return 0; }
  }

  // 刪 attendance（回傳實際刪除筆數）
  async function deleteAttendanceByStudent(studentId){
    const res = await rest(`/rest/v1/attendance?student_id=eq.${encodeURIComponent(studentId)}`, {
      method: 'DELETE', auth: true,
      headers: { 'Prefer': 'return=representation', 'Accept':'application/json' }
    });
    return Array.isArray(res) ? res.length : 0;
  }

  // 刪 students（要求把被刪的那列回傳，用來確認是否真的刪到）
  async function deleteStudentRow(studentId){
    const res = await rest(`/rest/v1/students?id=eq.${encodeURIComponent(studentId)}`, {
      method: 'DELETE', auth: true,
      headers: { 'Prefer': 'return=representation', 'Accept':'application/json' }
    });
    return Array.isArray(res) ? res.length : 0;
  }

  try{
    // 1) 先看有沒有被 attendance 參照
    const attCount = await countAttendanceOfStudent(s.id);
    if (attCount > 0){
      const ok = await showConfirm(
        `偵測到學員 ${label} 仍被 ${attCount} 筆出席紀錄參照。\n\n要先刪除這些出席紀錄再刪學員嗎？`
      );
      if (!ok) { showAlert('已取消刪除。'); return; }

      const delAtt = await deleteAttendanceByStudent(s.id);
      if (delAtt < attCount){
        setStuMsg(`僅刪除 ${delAtt}/${attCount} 筆出席紀錄，可能受權限（RLS）限制。`, 'note warn');
      }
    }

    // 2) 刪學員本身
    const delStu = await deleteStudentRow(s.id);
    if (delStu === 1){
      setStuMsg('刪除成功','note ok');
    } else if (delStu === 0){
      setStuMsg('未刪除任何資料：可能是權限/RLS 限制。請檢查 Supabase 的 RLS policy 是否允許目前身分刪除 students。', 'note danger');
      showAlert('刪除失敗：目前登入的角色沒有刪除權限（RLS）。\n請在 Supabase 調整 students/attendance 的 RLS policy 或改用擁有者帳號。');
      return;
    }

  }catch(e){
    const msg = String(e?.message || '');

    if (e?.status === 401 || e?.status === 403 || /jwt|token|expired/i.test(msg)){
      setStuMsg('刪除失敗：登入已過期或權限不足，請到「登入」分頁重新登入後再試。', 'note danger');
      showAlert('刪除失敗：登入過期或權限不足，請重新登入。');
      return;
    }

    if (e?.status === 409 || e?.code === '23503' || /foreign key|violates foreign key/i.test(msg)){
      showAlert('刪除失敗：仍有外鍵參照（attendance）。\n請重整後再試一次，或檢查 RLS policy 是否允許刪 attendance。');
      return;
    }

    showAlert('刪除失敗：' + msg);
    return;
  }

  // ✅ 前端表格與報到頁同步刷新
  if (__stu_rows.length === 1 && __stu_page > 1) __stu_page--;
  await loadStudentsAdmin();
  try { await loadStudentsAndAttendance(); } catch {}
}


  // ===== CSV 匯入 / 匯出範例 =====
  document.getElementById('btnExportSample')?.addEventListener('click', ()=>{
    const csv = '\uFEFFTeam,Function,Name(EN),ID\n' +
                '"Engineering","Backend","John Smith","E001"\n' +
                '"Engineering","Frontend","Jane Doe","E002"\n' +
                '"HR","HRBP","Alice Wang","H001"\n';
    const blob = new Blob([csv], { type:'text/csv;charset=utf-8;' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
    a.download = 'students_sample.csv'; a.click(); URL.revokeObjectURL(a.href);
  });

  document.getElementById('btnImportCsv')?.addEventListener('click', async ()=>{
    const csvMsg = document.getElementById('csvMsg');
    if (!state.access_token){ csvMsg.textContent='請先登入後再匯入。'; csvMsg.className='note warn'; return; }
    const file = document.getElementById('fileCsv')?.files?.[0];
    if (!file){ csvMsg.textContent='請先選擇 CSV 檔案。'; csvMsg.className='note warn'; return; }

    const mode = document.getElementById('csvMode')?.value || 'insert';
    csvMsg.textContent='解析中…'; csvMsg.className='note';
    Papa.parse(file, {
      header: true,
      skipEmptyLines: true,
      complete: async (result)=>{
        const rows = result.data;
        if (!rows.length){ csvMsg.textContent='CSV 無有效資料列。'; csvMsg.className='note warn'; return; }

        // ── 模式 A：更新 Function ──────────────────────────────────────
        if (mode === 'updateFn') {
          const records = rows.map(r=>{
            const emp = (r['ID']||r['id']||r['employee_no']||'').trim();
            const fn  = (r['Function']||r['function']||'').trim() || null;
            return { employee_no: emp, function: fn };
          }).filter(r=> r.employee_no);

          if (!records.length){ csvMsg.textContent='找不到有效欄位（需要 ID）。'; csvMsg.className='note warn'; return; }

          csvMsg.textContent=`準備更新 ${records.length} 筆 Function…`; csvMsg.className='note';
          let ok=0, notFound=0, fail=0;
          for (const rec of records){
            try{
              const res = await rest(
                `/rest/v1/students?employee_no=eq.${encodeURIComponent(rec.employee_no)}`,
                { method:'PATCH', auth:true,
                  headers:{ 'Prefer':'return=representation', 'Content-Type':'application/json' },
                  body: JSON.stringify({ function: rec.function }) }
              );
              // PostgREST 回傳空陣列表示找不到該 employee_no
              if (Array.isArray(res) && res.length === 0) notFound++;
              else ok++;
            }catch(e){ fail++; }
          }
          csvMsg.textContent=`更新完成：成功 ${ok} 筆，找不到學員 ${notFound} 筆，失敗 ${fail} 筆。`;
          csvMsg.className = fail ? 'note warn' : 'note ok';
          try{ await loadStudentsAndAttendance(); }catch{}
          return;
        }

        // ── 模式 B：新增名單（原有邏輯）─────────────────────────────────
        // 欄位對應（支援有/無 Function 欄位的舊格式）
        const records = rows.map(r=>{
          const team = (r['Team']||r['team']||'').trim();
          const fn   = (r['Function']||r['function']||'').trim() || null;
          const name = (r['Name(EN)']||r['Name']||r['name']||'').trim();
          const emp  = (r['ID']||r['id']||r['employee_no']||'').trim();
          return { team, function: fn, name, employee_no: emp };
        }).filter(r=> r.name && r.employee_no);

        if (!records.length){ csvMsg.textContent='找不到有效欄位（需要 Name(EN) 和 ID）。'; csvMsg.className='note warn'; return; }

        csvMsg.textContent=`準備匯入 ${records.length} 筆…`; csvMsg.className='note';
        let ok=0, skip=0, fail=0;
        for (const rec of records){
          try{
            await rest('/rest/v1/students?select=id', {
              method:'POST', auth:true,
              headers:{ 'Prefer':'resolution=ignore-duplicates,return=minimal' },
              body: JSON.stringify(rec)
            });
            ok++;
          }catch(e){
            if (e?.status===409 || /duplicate|unique/i.test(e?.message||'')) skip++;
            else fail++;
          }
        }
        csvMsg.textContent=`匯入完成：新增 ${ok} 筆，略過重複 ${skip} 筆，失敗 ${fail} 筆。`;
        csvMsg.className = fail ? 'note warn' : 'note ok';
        // 同步刷新學員報到頁
        try{ await loadStudentsAndAttendance(); }catch{}
      },
      error: (e)=>{ csvMsg.textContent='CSV 解析失敗：'+(e?.message||e); csvMsg.className='note error'; }
    });
  });

    // ===== 初始載入 =====
  function initAdminPickers(){ ['inpDate','inpStart','inpEnd'].forEach(id=>{ const el=document.getElementById(id); if(!el) return; }); }
  refreshAuthUI();
  ensureAdminDefaultTab();
  setupBroadcastReceiver();   // ← 新增：開始接收他裝置的報到廣播
  loadToday();
  initAdminPickers();

  // ===== Icon 按鈕點擊旋轉動畫 =====
  document.querySelectorAll('.icon-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      btn.classList.add('spin');
      // 動畫結束後移除 class，避免下次無效
      btn.addEventListener('animationend', ()=>{
        btn.classList.remove('spin');
      }, {once:true});
    });
  });
</script>

<!-- 進場動畫：fade-up+blur, IntersectionObserver 觸發, 與上方 Supabase 邏輯無關（純視覺, 不影響任何 CQE.api 呼叫）-->
<script>
(function(){
  const targets = document.querySelectorAll('.card[data-reveal]');
  if (!('IntersectionObserver' in window) || !targets.length){
    targets.forEach(el => el.classList.add('is-visible'));
    return;
  }
  const io = new IntersectionObserver((entries)=>{
    entries.forEach(entry=>{
      if (entry.isIntersecting){
        entry.target.classList.add('is-visible');
        io.unobserve(entry.target);
      }
    });
  }, { threshold:.1 });
  targets.forEach(el => io.observe(el));
})();
</script>
