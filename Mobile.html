<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>CQE | AI Class Check-In（Mobile）</title>
<meta name="description" content="Mobile-first, today-only check-in: search or enter employee ID, tap to check in.">
<link rel="stylesheet" href="styles/tokens.css">

<style>
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;background:var(--bg);color:var(--text);
    font:16px/1.55 var(--font);
    -webkit-font-smoothing:antialiased;
  }

  /* ── 版面骨架：側欄 + 卡片牆 (>=768px 兩欄, <768px 單欄) ─────── */
  /* --dock-h 由 JS ResizeObserver 即時量測 .dock 實際高度寫入, 避免 magic number 造成清單被蓋住 */
  .page{max-width:1200px;margin:0 auto;padding:20px;min-height:100dvh;padding-bottom:calc(var(--dock-h, 220px) + 24px)}
  .col-main{min-width:0} /* grid 欄位內含 sticky dock, 只佔右欄寬度不跨側欄 */
  header.topbar{display:flex;align-items:center;gap:12px;margin:4px 0 20px}
  .logo{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;overflow:hidden;flex-shrink:0}
  .brand h1{font-size:18px;margin:0;color:var(--text);font-weight:700}
  .brand .sub{color:var(--muted);font-size:12px;margin-top:2px}
  .header-actions{display:flex;gap:8px;flex-shrink:0}
  .icon-btn{
    display:inline-flex;align-items:center;justify-content:center;
    width:40px;height:40px;border-radius:999px;flex-shrink:0;
    background:var(--glass);border:1px solid var(--line);color:var(--text);
    font-size:18px;line-height:1;text-decoration:none;
    transition:border-color .2s var(--ease), background .2s var(--ease), transform .15s var(--ease);
  }
  .icon-btn:hover{background:var(--glass-hi);border-color:var(--line-hi)}
  .icon-btn:active{transform:scale(.94)}

  .layout{display:grid;grid-template-columns:1fr;gap:16px}
  @media (min-width:768px){
    .layout{grid-template-columns:320px 1fr;align-items:start;gap:20px}
  }

  /* ── 雙層 bezel 面板：外殼 glass+line+r-out / 內核 core+r-in+inset-hi ── */
  .panel{
    background:var(--glass);border:1px solid var(--line);border-radius:var(--r-out);
    padding:6px;
    opacity:0;transform:translateY(16px);filter:blur(6px);
    transition:opacity .8s var(--ease), transform .8s var(--ease), filter .8s var(--ease);
  }
  .panel.is-visible{opacity:1;transform:translateY(0);filter:blur(0)}
  .panel-inner{
    background:var(--core);border-radius:var(--r-in);box-shadow:var(--inset-hi);
    padding:24px;
  }
  .panel-inner h3{margin:0 0 4px;color:var(--text);font-size:16px}
  .note{font-size:12px;color:var(--muted);margin-top:8px}
  .warn{color:var(--warn)} .ok{color:var(--ok)} .error{color:var(--danger)}

  .row{display:flex;gap:8px;flex-wrap:wrap}
  .row-between{align-items:center;justify-content:space-between}

  /* ── 表單元件 ────────────────────────────────────────────── */
  input,select{
    width:100%;padding:12px 14px;border-radius:14px;
    border:1px solid var(--line);background:var(--core-2);color:var(--text);font-size:16px;
    font-family:var(--font);
    transition:border-color .2s var(--ease), box-shadow .2s var(--ease);
  }
  input::placeholder{color:var(--dim)}
  input:focus-visible, select:focus-visible{
    outline:none;border-color:rgba(91,184,255,.5);box-shadow:0 0 0 4px rgba(91,184,255,.09);
  }

  /* ── 按鈕：一律外框式 pill, 禁實心填色 ─────────────────────── */
  .btn{
    appearance:none;border:1px solid var(--line-hi);background:var(--glass);color:var(--accent);
    border-radius:999px;padding:12px 16px;line-height:1.2;cursor:pointer;width:100%;font-weight:600;
    font-family:var(--font);font-size:15px;
    transition:border-color .2s var(--ease), background .2s var(--ease), transform .15s var(--ease);
  }
  .btn:hover{background:var(--glass-hi);border-color:var(--accent)}
  .btn:active{transform:scale(.98)}
  .btn:focus-visible{outline:none;border-color:rgba(91,184,255,.5);box-shadow:0 0 0 4px rgba(91,184,255,.09)}
  .btn:disabled{opacity:.4;cursor:not-allowed}
  .btn.ghost{color:var(--muted)}
  .btn.inline{width:auto;padding:10px 14px}

  /* Function tab bar */
  #fnBar{
    display:flex;gap:6px;flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;margin-top:10px;
    -webkit-overflow-scrolling:touch;
  }
  /* 第 6 項: 刻意設計的單行橫向捲動列, 走 ui-spec 3a 隱藏卷軸例外變體 (交付說明已註明理由) */
  .scroll-hide::-webkit-scrollbar{display:none}
  .scroll-hide{scrollbar-width:none;-ms-overflow-style:none}
  .fn-btn-m{
    appearance:none;border:1px solid var(--line);background:var(--glass);color:var(--muted);
    border-radius:999px;padding:8px 16px;font-size:13px;font-weight:600;font-family:var(--font);
    cursor:pointer;white-space:nowrap;flex-shrink:0;min-height:36px;
    transition:border-color .2s var(--ease), color .2s var(--ease), background .2s var(--ease);
  }
  .fn-btn-m.active{background:rgba(91,184,255,.1);border-color:var(--accent);color:var(--accent)}
  .fn-btn-m:focus-visible{outline:none;border-color:rgba(91,184,255,.5);box-shadow:0 0 0 4px rgba(91,184,255,.09)}

  /* ── 學員列表 ───────────────────────────────────────────── */
  #list{display:grid;gap:8px;margin-top:10px}
  .item{
    display:flex;align-items:center;gap:12px;
    background:var(--core-2);border:1px solid var(--line);border-radius:14px;padding:12px 14px;
    touch-action:manipulation;-webkit-tap-highlight-color:transparent;cursor:pointer;
    transition:border-color .2s var(--ease), background .2s var(--ease), transform .15s var(--ease);
  }
  .item:active{transform:scale(.99)}
  .item:focus-visible{outline:none;border-color:rgba(91,184,255,.5);box-shadow:0 0 0 4px rgba(91,184,255,.09)}
  .av{width:36px;height:36px;border-radius:50%;background:var(--glass-hi);border:1px solid var(--line);display:grid;place-items:center;font-size:13px;font-weight:700;letter-spacing:.5px;color:var(--text);flex-shrink:0}
  .name{font-weight:700;color:var(--text)}
  .tag-ok{
    margin-left:auto;font-size:11px;background:rgba(52,211,153,.1);color:var(--ok);
    border:1px solid rgba(52,211,153,.4);border-radius:999px;padding:4px 10px;flex-shrink:0;
  }
  .item.checked{border-color:rgba(52,211,153,.4);background:rgba(52,211,153,.06)}

  #tipCourse.bump{animation:stat-bump .45s var(--ease)}

  /* ── 底部自助報到 dock（sticky, 可用 backdrop-blur）───────── */
  .dock{position:sticky;bottom:0;left:0;right:0;padding-top:16px;z-index:20}
  .dock::before{
    content:'';position:absolute;inset:-40px 0 0;background:linear-gradient(180deg, transparent, var(--bg) 55%);
    pointer-events:none;z-index:-1;
  }
  .dock .panel{opacity:1;transform:none;filter:none;backdrop-filter:blur(12px)}
  .dock .panel-inner{padding:16px}
  .dock .row + .row{margin-top:8px}

  /* ── 切換到桌機版：置入 header, 移除原本 fixed 定位避免與 dock 重疊 ── */
  .switcher{
    display:inline-flex;align-items:center;gap:6px;
    background:var(--glass);color:var(--muted);border:1px solid var(--line);
    border-radius:999px;padding:0 14px;height:40px;font-size:13px;text-decoration:none;flex-shrink:0;
    transition:border-color .2s var(--ease), color .2s var(--ease);
  }
  .switcher:hover{color:var(--text);border-color:var(--line-hi)}

  /* ── Toast：置頂, 避開 dock；外框式非實心 ─────────────────── */
  .toast{
    position:fixed;left:50%;top:16px;transform:translateX(-50%) translateY(-12px);
    background:var(--core);border:1px solid var(--line-hi);color:var(--text);padding:10px 16px;border-radius:999px;
    box-shadow:0 10px 30px rgba(0,0,0,.45);opacity:0;pointer-events:none;
    transition:opacity .25s var(--ease), transform .25s var(--ease);
    font-size:13px;z-index:200;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .toast.success{border-color:rgba(52,211,153,.5);color:var(--ok)}
  .toast.dup{border-color:rgba(91,184,255,.5);color:var(--accent)}
  .toast.error{border-color:rgba(248,113,113,.5);color:var(--danger)}

  /* ── Modal ─────────────────────────────────────────────── */
  .modal-mask{
    position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;
    z-index:100;backdrop-filter:blur(4px);
  }
  .modal-mask.show{display:flex}
  .modal{background:var(--glass);border:1px solid var(--line);border-radius:var(--r-out);width:90%;max-width:420px;padding:6px}
  .modal-inner{background:var(--core);border-radius:var(--r-in);box-shadow:var(--inset-hi);padding:22px;color:var(--text)}
  .modal-inner h3{margin:0 0 12px;font-size:16px;color:var(--text)}
  .modal-inner label{display:block;font-size:12px;color:var(--muted);margin:12px 0 4px}

  @media (max-width:480px){
    .page{padding:14px;padding-bottom:calc(var(--dock-h, 220px) + 24px)}
    .panel-inner{padding:18px}
  }
</style>
</head>
<body>
<div class="page">
<header class="topbar">
  <a href="index.html?ref=desktop" class="logo" title="返回選單" style="text-decoration:none;cursor:pointer">
    <img src="bear-logo_(Security C).ico" alt="Logo" style="width:100%;height:100%;object-fit:contain">
  </a>
  <div class="brand" style="flex:1">
    <h1>CQE | AI Class Check-In</h1>
    <div class="sub" id="todayTxt">今天：</div>
  </div>
  <div class="header-actions">
    <a class="switcher" href="Desktop.html?view=desktop" title="切換到桌機版">↔️ 桌機版</a>
    <a class="icon-btn" href="index.html?ref=desktop" title="課程排程平台">📅</a>
  </div>
</header>

<div class="layout">
  <!-- Next Class（側欄）-->
  <section class="panel" data-reveal>
    <div class="panel-inner">
      <div class="row row-between">
        <h3>Next Class</h3>
        <div id="tipCourse" class="note"></div>
      </div>
      <div class="row" style="margin-top:12px">
        <select id="selCourse" aria-label="選擇今日課程"></select>

      </div>
    </div>
  </section>

  <!-- 右欄：快速搜尋/點名 + 自助報到 dock 同屬一個 grid column, dock 不跨側欄 -->
  <div class="col-main">
    <section class="panel" data-reveal>
      <div class="panel-inner">
        <h3>快速搜尋 / 點名</h3>
        <div id="fnBar" class="scroll-hide"></div>
        <input id="q" placeholder="搜尋學員（Team / Name / ID）" autocomplete="off" inputmode="search" style="margin-top:10px">
        <div id="list"></div>
        <div id="emptyMsg" class="note"></div>
      </div>
    </section>

    <!-- 自助報到（sticky dock，只在本欄內 sticky，不覆蓋側欄）-->
    <div class="dock">
      <div class="panel">
        <div class="panel-inner">
          <h3>自助報到</h3>
          <div class="row">
            <input id="emp" placeholder="例如：A123456" autocomplete="off" inputmode="text" />
            <button id="btnIn" class="btn" type="button">立即報到</button>
          </div>
          <div class="row" style="margin-top:8px">
            <button id="btnClear" class="btn ghost" type="button">清除</button>
          </div>
          <div id="msg" class="note"></div>
        </div>
      </div>
    </div>
  </div>
</div>
</div>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<!-- 自助建立學員 Modal -->
<!-- 報到前身分確認 (防誤點他人名字) -->
<div id="confirmCheckinMask" class="modal-mask" role="dialog" aria-modal="true" aria-labelledby="confirmCheckinTitle">
  <div class="modal">
    <div class="modal-inner">
      <h3 id="confirmCheckinTitle">請確認是你本人</h3>
      <div class="note" style="margin:0 0 12px">確認以下資料無誤後再完成報到</div>
      <div id="confirmCheckinRows" style="display:grid;grid-template-columns:auto 1fr;gap:8px 14px;font-size:14px"></div>
      <div class="row" style="margin-top:18px;justify-content:flex-end">
        <button id="btnCheckinCancel" class="btn ghost inline" type="button">取消</button>
        <button id="btnCheckinOk" class="btn inline" type="button">確認報到</button>
      </div>
    </div>
  </div>
</div>

<div id="modalNewMask" class="modal-mask" role="dialog" aria-modal="true" aria-labelledby="modalNewTitle">
  <div class="modal">
    <div class="modal-inner">
      <h3 id="modalNewTitle">不在名單？自助建立學員</h3>
      <label>工號</label>
      <input id="newEmp" type="text" placeholder="例如：A123456" autocomplete="off">
      <label>Function（職能，可空）</label>
      <input id="newFunction" type="text" placeholder="Function" autocomplete="off">
      <label>Team（必填）</label>
      <input id="newTeam" type="text" placeholder="Team(組站)" autocomplete="off">
      <label>姓名</label>
      <input id="newName" type="text" placeholder="英文" autocomplete="off">
      <div class="row" style="margin-top:14px;justify-content:flex-end">
        <button id="btnCancelNew" class="btn ghost inline" type="button">取消</button>
        <button id="btnSaveNew" class="btn inline" type="button">建立</button>
      </div>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.105.4/dist/umd/supabase.js"></script>

<script src="src/config.js?v=20260711"></script>
<script src="src/utils.js?v=20260711"></script>

<script>

/* ===== Phase 2 共用模組解構 ===== */
const { SUPABASE_URL, SUPABASE_ANON_KEY } = window.CQE.config;
const sb = window.CQE.sb;
const { escapeHtml, getInitials, fmt, todayStr } = window.CQE.utils;
const { rest } = window.CQE.api;
const { doCheckin } = window.CQE.checkin;

/* ===== App 程式 ===== */

const $ = (q)=>document.querySelector(q);
const selCourse = $('#selCourse'), btnReload=$('#btnReload');
const q = $('#q'), list = $('#list'), emptyMsg=$('#emptyMsg');
const emp = $('#emp'), btnIn=$('#btnIn'), btnClear=$('#btnClear'), msg=$('#msg');
const modalMask = $('#modalNewMask'), newEmp=$('#newEmp'), newName=$('#newName'), newTeam=$('#newTeam'), newFunction=$('#newFunction');
const btnCancelNew=$('#btnCancelNew'), btnSaveNew=$('#btnSaveNew');

$('#todayTxt').textContent = '今天：' + todayStr();

/* Toast（支援 success / dup / error） */
function toast(text, type='success'){
  const el = $('#toast');
  el.textContent = text;
  el.classList.remove('success','dup','error');
  if (type==='success' || type==='dup' || type==='error'){ el.classList.add(type); }
  el.classList.add('show');
  clearTimeout(el.__t);
  el.__t = setTimeout(()=> el.classList.remove('show'), 2500);
}

/* ===== 狀態與工具 ===== */
let STUDENTS = [];
let CHECKED = new Set();
let __isSubmitting = false;
// === Mobile 端 Postgres Realtime 訂閱 ===
let __rtCh = null;
function setupRealtimeAttendanceMobile(courseId){
  try{
    if (__rtCh){
      sb.removeChannel(__rtCh);
      __rtCh = null;
    }
    if (!courseId) return;

    const cidStr = String(courseId);

    __rtCh = sb
      .channel(`mobile-attendance-${cidStr}`)
      .on(
        'postgres_changes',
        {
          event: 'INSERT',             // ← 只聽 INSERT（新報到）
          schema: 'public',
          table: 'attendance',
          filter: `course_id=eq.${cidStr}`
        },
        (payload) => {
          const sid = payload?.new?.student_id;
          const cid = payload?.new?.course_id;
          if (!sid || String(cid) !== String(currentCourseId)) return;

          CHECKED.add(String(sid));  // ← 一律字串

          const card = list.querySelector(`[data-sid="${String(sid)}"]`);
          if (card){
            card.classList.add('checked');
            if (!card.querySelector('.tag-ok')){
              const tag = document.createElement('span');
              tag.className = 'tag-ok';
              tag.textContent = '已報到';
              card.appendChild(tag);
            }
          }
          updateStats();
        }
      )
      .subscribe((status, err) => {
        if (status === 'CHANNEL_ERROR' || status === 'TIMED_OUT') {
          console.warn('Mobile Realtime 訂閱異常：', status, err);
        }
      });
  }catch(e){
    console.warn('setupRealtimeAttendanceMobile 失敗：', e);
  }
}


let currentCourseId = null;

// 是否為「今日課程」（影響是否允許報到）
let isTodayCourse = true;
// 以 id 快取課程物件（用於切換時判斷日期）
let COURSE_BY_ID = new Map();
let __selectedFnMobile = null; // null = 全部

/* ✅ 統計函式（已報到 / 未報到 / 參與率）＋縮放動畫 */
let __prevStatsMobile = { checked:null, unchecked:null, rate:null }; // 👈 新增：記錄上次數值

function updateStats(){
  // 依目前選取的 Function Tab 過濾後再計算統計
  const filteredStudents = __selectedFnMobile !== null
    ? STUDENTS.filter(s => (s.function||'').trim() === __selectedFnMobile)
    : STUDENTS;
  const total   = filteredStudents.length;
  const checked = filteredStudents.filter(s => CHECKED.has(String(s.id))).length;
  const unchecked = Math.max(0, total - checked);
  const rate = total > 0 ? Math.round(checked * 100 / total) : 0;

  const tip = document.getElementById('tipCourse');
  if (!tip) return;

  if (isTodayCourse){
    tip.classList.remove('warn','error');
    tip.textContent = `已報到: ${checked} 人, 未報到: ${unchecked} 人, 參與率: ${rate}%`;

    // 👇 關鍵：有變化就觸發縮放動畫
    const changed =
      __prevStatsMobile.checked   !== checked ||
      __prevStatsMobile.unchecked !== unchecked ||
      __prevStatsMobile.rate      !== rate;

    if (changed){
      tip.classList.remove('bump'); // 先移除
      void tip.offsetWidth;         // 強制回流，重置動畫
      tip.classList.add('bump');    // 再加回去就會播放
    }

    __prevStatsMobile = { checked, unchecked, rate };
  }else{
    tip.classList.remove('error');
    tip.classList.add('warn');
    tip.textContent = '*非當日課程,無法報到';
  }
}


/* 依 isTodayCourse 鎖定輸入與按鈕 */
function applyCheckinLock(){
  btnIn.disabled = !isTodayCourse;
  emp.disabled   = !isTodayCourse;
  updateStats();
}

/* 今日課程（若無 → fallback 下一場課程唯讀） */
async function loadTodayCourses(){
  selCourse.innerHTML = '';
  COURSE_BY_ID.clear();
  isTodayCourse = true;

  try{
    const today = todayStr();

    // 1) 先抓「今日」的課程
    let rows = await rest('/rest/v1/courses?select=*&date=eq.'+today);
    if (rows?.length){
      selCourse.append(new Option('請選擇課程',''));
      rows.sort((a,b)=> (a.start_time||'').localeCompare(b.start_time||''));
      rows.forEach(c=>{
        COURSE_BY_ID.set(c.id, c);
        const t = c.start_time? `（${c.start_time.slice(0,5)}~${(c.end_time||'').slice(0,5)}）` : '';
        selCourse.append(new Option(`${c.title} ${t}`, c.id));
      });
      isTodayCourse = true;
      applyCheckinLock();
      if (rows.length===1){
  selCourse.value = rows[0].id;
  await loadStudents();
  // ✅ 確保第一次自動選課也立即訂閱
  setupRealtimeAttendanceMobile(selCourse.value);
} else {
  const saved = sessionStorage.getItem('mobileCourseId');
  if (saved && Array.from(selCourse.options).some(o => o.value === saved)){
    selCourse.value = saved;
    const c = COURSE_BY_ID.get(Number(saved)) || COURSE_BY_ID.get(saved);
    isTodayCourse = !!(c && c.date === todayStr());
    applyCheckinLock();
    await loadStudents();
    setupRealtimeAttendanceMobile(saved);
  }
}

      return;
    }

    // 2) 沒有今日課 → 抓「下一場」未來課程
    const next = await rest(`/rest/v1/courses?select=*&date=gt.${today}&order=date.asc,start_time.asc&limit=1`);
    if (next?.length){
      const c = next[0];
      COURSE_BY_ID.set(c.id, c);
      const t = c.start_time? `（${c.start_time.slice(0,5)}~${(c.end_time||'').slice(0,5)}）` : '';
      selCourse.append(new Option(`${c.date} ${c.title} ${t}`, c.id));
      selCourse.value = c.id;

      isTodayCourse = false;      // 非今日 → 唯讀
      applyCheckinLock();
      await loadStudents();       // 顯示名單但禁止報到
      return;
    }

    // 3) 完全沒有未來課程
    selCourse.append(new Option('近期沒有課程',''));
    isTodayCourse = false;
    applyCheckinLock();
    const tip = $('#tipCourse'); if (tip){ tip.textContent = '目前沒有可顯示的課程。'; tip.classList.add('warn'); }

  }catch(e){
    const tip = $('#tipCourse'); if (tip){ tip.textContent = '讀取課程失敗：'+e.message; tip.classList.add('error'); }
  }
}

/* Function Tab 渲染與切換 */
function renderFnBar(){
  const bar = document.getElementById('fnBar');
  if (!bar) return;
  bar.innerHTML = '';
  const fns = [...new Set(STUDENTS.map(s => (s.function||'').trim()).filter(Boolean))].sort();
  if (!fns.length){ bar.style.display = 'none'; return; }
  bar.style.display = '';

  const allBtn = document.createElement('button');
  allBtn.type = 'button';
  allBtn.className = 'fn-btn-m' + (__selectedFnMobile === null ? ' active' : '');
  allBtn.textContent = '全部';
  allBtn.addEventListener('click', () => selectFnMobile(null));
  bar.appendChild(allBtn);

  fns.forEach(fn => {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'fn-btn-m' + (__selectedFnMobile === fn ? ' active' : '');
    btn.textContent = fn;
    btn.addEventListener('click', () => selectFnMobile(fn));
    bar.appendChild(btn);
  });
}

function selectFnMobile(fn){
  __selectedFnMobile = fn;
  renderFnBar();
  renderList();
  updateStats();
}

/* 名單渲染 */
function renderList(){
  list.innerHTML = '';
  const keyword = (q.value||'').trim().toLowerCase();
  let rows = STUDENTS;

  if (keyword){
    rows = rows.filter(s =>
      (s.function||'').toLowerCase().includes(keyword) ||
      (s.team||'').toLowerCase().includes(keyword) ||
      (s.name||'').toLowerCase().includes(keyword) ||
      (s.employee_no||'').toLowerCase().includes(keyword)
    );
  }

  if (__selectedFnMobile !== null){
    rows = rows.filter(s => (s.function||'').trim() === __selectedFnMobile);
  }

  if (!rows.length){
    emptyMsg.textContent = keyword ? '找不到符合的學員' : '尚未匯入學員名單';
    updateStats(); // 即使空也刷新統計
    return;
  }
  emptyMsg.textContent = '';

rows.forEach(s=>{
  const el = document.createElement('div');
  const ok = CHECKED.has(String(s.id)); // ← 用字串判斷
  el.className = 'item'+(ok?' checked':'');
  el.innerHTML = `
    <div class="av">${escapeHtml(getInitials(s.name||''))}</div>
    <div>
      <div class="name">${escapeHtml(s.name||'')}</div>
      ${s.function ? `<div style="font-size:11px;color:var(--muted);margin-top:2px">${escapeHtml(s.function)}</div>` : ''}
    </div>
    ${ok?'<span class="tag-ok">已報到</span>':''}
  `;
  el.dataset.emp = s.employee_no || '';
  el.dataset.sid = String(s.id); // ← DOM 上也放字串

  el.addEventListener('click', async()=>{
    if (!currentCourseId){ toast('請先選擇今日課程', 'error'); return; }
    if (!isTodayCourse){ toast('此為「非今日課程」，僅供查看名單，無法報到。', 'error'); return; }
    if (__isSubmitting) return;
    // 防誤點: 未報到者先確認身分 (已報到者點了只會顯示重複提示, 免確認)
    if (!CHECKED.has(String(s.id))){
      const okId = await confirmCheckinIdentity(s);
      if (!okId) return;
    }
    __isSubmitting = true;
    try{
      const _r = await doCheckin(currentCourseId, { id: s.id });

      CHECKED.add(String(s.id));            // ← 一律字串
      el.classList.add('checked');
      if (!el.querySelector('.tag-ok')){
        const tag=document.createElement('span');
        tag.className='tag-ok'; tag.textContent='已報到';
        el.appendChild(tag);
      }
      toast(_r.duplicated ? '✅ 已報到（重複略過）' : '🎉 報到成功：'+(s.name||''), _r.duplicated ? 'dup' : 'success');
      updateStats();
    }catch(e){
      toast('❌ 報到失敗：'+(e.message||''), 'error');
    }finally{
      __isSubmitting = false;
    }
  }, {passive:true});

  list.appendChild(el);
});


  updateStats(); // 初次渲染後更新一次
}

/* 載入學員 + 當前課程出席情況 */
async function loadStudents(){
  list.innerHTML = ''; q.value='';
  emptyMsg.textContent = '載入中…'; emptyMsg.className = 'note';
  const cid = selCourse.value;

  // ✅ 統一成字串，供 Broadcast/Realtime/比對使用
  currentCourseId = cid ? String(cid) : null;

  if (!cid){
    setupRealtimeAttendanceMobile(null);
    return;
  }

  try{
    const studs = await rest('/rest/v1/students?select=*&limit=2000');
    STUDENTS = Array.isArray(studs)? studs : [];
    STUDENTS.sort((a,b)=> (a.name||'').localeCompare(b.name||'', 'en', {sensitivity:'base'}));
    __selectedFnMobile = null; // 切換課程時重置 Function 篩選
    renderFnBar();
  }catch(e){
    emptyMsg.textContent = '讀取學員失敗：'+e.message;
    emptyMsg.classList.add('error'); return;
  }

  CHECKED = new Set();
  try{
    const att = await rest(`/rest/v1/attendance?select=student_id&course_id=eq.${encodeURIComponent(cid)}`);
    (att||[]).forEach(a=> CHECKED.add(String(a.student_id))); // ← 一律字串
  }catch(e){/* ignore */ }

  renderList();

  // ← 載入完就訂閱
  setupRealtimeAttendanceMobile(cid);
}

  }catch(e){
    msg.textContent='報到失敗：'+(e.message||''); msg.className='note error';
    toast('❌ 報到失敗', 'error');

});

function openNewStudentModal(empNo=''){

/* ── 報到前身分確認 (防誤點他人名字): 顯示 Function/部門碼/ID/名字, 確認才報到 ── */
function confirmCheckinIdentity(s){
  return new Promise(resolve=>{
    const mask = document.getElementById('confirmCheckinMask');
    const rows = document.getElementById('confirmCheckinRows');
    const okBtn = document.getElementById('btnCheckinOk');
    const cancelBtn = document.getElementById('btnCheckinCancel');
    const items = [
      ['Function', s.function || '—'],
      ['部門碼', s.team || '—'],
      ['ID', s.employee_no || '—'],
      ['名字', s.name || '—']
    ];
    rows.innerHTML = items.map(([k,v])=>
      '<div style="color:var(--muted)">' + escapeHtml(k) + '</div>' +
      '<div style="color:var(--text);font-weight:700">' + escapeHtml(v) + '</div>'
    ).join('');
    mask.classList.add('show');
    function done(val){
      mask.classList.remove('show');
      okBtn.removeEventListener('click', onOk);
      cancelBtn.removeEventListener('click', onCancel);
      mask.removeEventListener('click', onMask);
      document.removeEventListener('keydown', onKey);
      resolve(val);
    }
    function onOk(){ done(true); }
    function onCancel(){ done(false); }
    function onMask(e){ if (e.target === mask) done(false); }
    function onKey(e){ if (e.key === 'Escape') done(false); }
    okBtn.addEventListener('click', onOk);
    cancelBtn.addEventListener('click', onCancel);
    mask.addEventListener('click', onMask);
    document.addEventListener('keydown', onKey);
  });
}

async function onSaveNewStudent(){
  const empNo = (newEmp.value||'').trim();
  const name  = (newName.value||'').trim();
  const team  = (newTeam.value||'').trim();
  const fn    = (newFunction.value||'').trim() || null;
  if (!empNo || !name || !team){ toast('Team / 姓名 / 工號皆為必填','error'); return; }
  if (__isSubmitting) return;
  __isSubmitting = true;

  try{
    const ins = await rest('/rest/v1/students?select=*', {
      method:'POST',
      headers:{ 'Prefer':'return=representation' },
      body: JSON.stringify({ employee_no: empNo, name, team, function: fn })
    });
    const s = Array.isArray(ins) ? ins[0] : ins;

    // 若為今日課程則直接報到；否則只建立不報到
    if (!currentCourseId || !isTodayCourse){
      toast('已建立學員，但目前非今日課程，未執行報到。','dup');
      closeNewStudentModal();
      // 更新快取名單
      STUDENTS.push(s);
      STUDENTS.sort((a,b)=> (a.name||'').localeCompare(b.name||'', 'en', {sensitivity:'base'}));
      renderList();
      return;
    }

    await doCheckin(currentCourseId, { id: s.id });

    // ★ 這行改為字串：String(s.id)
    CHECKED.add(String(s.id));

    toast('🎉 建立並報到成功','success');
    closeNewStudentModal();

    // 更新快取與畫面
    emp.value = '';
    STUDENTS.push(s);
    STUDENTS.sort((a,b)=> (a.name||'').localeCompare(b.name||'', 'en', {sensitivity:'base'}));
    renderList();

  }catch(e){
    toast('❌ 建立失敗：'+(e?.message||e),'error');
  }finally{
    __isSubmitting = false;
  }
}

<!-- 進場動畫：fade-up+blur, IntersectionObserver 觸發, 與上方 Supabase 邏輯無關 -->
<script>
(function(){
  const targets = document.querySelectorAll('[data-reveal]');
  if (!('IntersectionObserver' in window) || !targets.length){
    targets.forEach(el => el.classList.add('is-visible'));
    return;
  }
  const io = new IntersectionObserver((entries)=>{
    entries.forEach(entry=>{
      if (entry.isIntersecting){
        entry.target.classList.add('is-visible');
        io.unobserve(entry.target);
      }
    });
  }, { threshold:.15 });
  targets.forEach(el => io.observe(el));
})();
</script>

<!-- dock 實際高度量測：修正 padding-bottom magic number 蓋住清單最後一行的問題 -->
<script>
(function(){
  const dockEl = document.querySelector('.dock');
  const pageEl = document.querySelector('.page');
  if (!dockEl || !pageEl) return;
  const setH = (h)=> pageEl.style.setProperty('--dock-h', Math.ceil(h) + 'px');
  if ('ResizeObserver' in window){
    new ResizeObserver(entries=>{
      for (const entry of entries) setH(entry.contentRect.height);
    }).observe(dockEl);
  } else {
    setH(dockEl.offsetHeight);
    window.addEventListener('resize', ()=> setH(dockEl.offsetHeight));
  }
})();
</script>
